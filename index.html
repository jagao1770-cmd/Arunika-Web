  <style>
    :root {
      --green: #176b3a;
      --green-dark: #0d4827;
      --lime: #dcefa9;
      --cream: #f7faf4;
      --gold: #d59c15;
      --silver: #80909c;
      --bronze: #a86635;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Work Sans", sans-serif;
      color: #173022;
      background: #f7faf4;
    }

    .site-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      background:
        radial-gradient(circle at 85% 5%, #e9f7c6 0, transparent 30%),
        linear-gradient(135deg, #f9fcf4, #eef7e8);
    }

    .leaf-pattern {
      background-image: radial-gradient(#d9edc6 1px, transparent 1px);
      background-size: 18px 18px;
    }

    .nav-btn {
      border-radius: 999px;
      padding: .6rem .9rem;
      font-size: .875rem;
      font-weight: 600;
      transition: .2s;
    }

    .nav-btn:hover,
    .nav-btn:focus-visible {
      background: #e5f2d8;
      outline: 3px solid #c1df93;
      outline-offset: 2px;
    }

    .nav-btn.active {
      background: var(--green);
      color: white;
    }

    .card {
      background: rgba(255,255,255,.93);
      border: 1px solid #dbe9d4;
      box-shadow: 0 12px 30px rgba(26,77,40,.08);
      border-radius: 1.25rem;
    }

    .input {
      width: 100%;
      border: 1px solid #b9d2b4;
      background: #fff;
      border-radius: .7rem;
      padding: .7rem .8rem;
      color: #173022;
    }

    .input:focus {
      outline: 3px solid #d9edb9;
      border-color: #3b8757;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      border-radius: .7rem;
      padding: .7rem 1rem;
      font-weight: 700;
      transition: .2s;
    }

    .btn:focus-visible {
      outline: 3px solid #bddf8b;
      outline-offset: 2px;
    }

    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-soft { background: #eaf5df; color: var(--green-dark); }
    .btn-danger { background: #b92d2d; color: #fff; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: .32rem .65rem;
      font-size: .75rem;
      font-weight: 700;
    }

    .kolom-pilih { display: none; }
    .mode-hapus .kolom-pilih { display: table-cell; }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #dcebd5;
      border-radius: 1rem;
    }

    table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      background: #fff;
    }

    th {
      background: #eff7e9;
      color: #31543b;
      font-size: .75rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    th, td {
      padding: .85rem 1rem;
      text-align: left;
      border-bottom: 1px solid #e4efe0;
      vertical-align: middle;
    }

    .modal-layer {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(8,32,16,.62);
    }

    .modal-box {
      width: min(100%, 640px);
      max-height: 90%;
      overflow: auto;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 25px 70px rgba(0,0,0,.3);
    }

    #qrFullscreen { position: fixed; inset: 0; z-index: 100; background: #000; display: flex; align-items: center; justify-content: center; }
    #qrFsReader { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border: 0 !important; }
    #qrFsReader video { width: 100% !important; height: auto !important; max-height: 100%; }
    #qrFsClose { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 3; width: 44px; height: 44px; border-radius: 9999px; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 22px; line-height: 1; }
    #qrFsBanner { position: absolute; left: 12px; right: 12px; bottom: max(20px, env(safe-area-inset-bottom)); z-index: 3; padding: 14px 16px; border-radius: 16px; color: #fff; text-align: center; opacity: 0; transform: translateY(12px); transition: opacity .15s, transform .15s; pointer-events: none; }
    #qrFsBanner.show { opacity: 1; transform: none; }
    .qr-fs-title { font-weight: 800; font-size: 1.15rem; }
    .qr-fs-sub { margin-top: 2px; font-size: .95rem; }

    .toast {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 80;
      max-width: 360px;
      animation: slideIn .25s ease-out;
    }

    .spin { animation: spin 1s linear infinite; }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden { display: none !important; }

    @media (max-width: 640px) {
      .desktop-nav { display: none; }
      .content-pad { padding: 1rem; }
      .hero-title { font-size: 2rem; }
    }

    /* ===== RESPONSIF: ponsel, tablet, laptop, komputer ===== */
    html { -webkit-text-size-adjust: 100%; }
    img, video, svg { max-width: 100%; }
    main#app {
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }

    /* Menu admin: ponsel & tablet = bilah menu geser di atas; laptop/komputer = sidebar kiri. */

    /* Tabel */

      white-space: normal; line-height: 1.25; overflow-wrap: anywhere; box-shadow: 2px 0 0 #e4efe0;
    }

    @media (pointer: coarse) { .btn, .nav-btn, .input { min-height: 44px; } }

      .abs-opsi label { display: block; }

        display: flex !important; align-items: center; justify-content: center; text-align: center;
        min-height: 44px; padding: .4rem .1rem !important;
      }
      .modal-layer { align-items: flex-end; padding: 0; }
      .modal-box {
        width: 100%; max-height: 92%; border-radius: 1.25rem 1.25rem 0 0;
        padding-bottom: max(1.5rem, env(safe-area-inset-bottom)) !important;
      }
      .toast { left: 1rem; right: 1rem; max-width: none; bottom: max(1rem, env(safe-area-inset-bottom)); }

    /* Tablet (potret & lanskap) */

    }
    @media (min-width: 640px) and (max-width: 1023.98px) {

    /* Laptop */
    @media (min-width: 1024px) {
      .admin-layout { grid-template-columns: 232px minmax(0, 1fr); gap: 1.5rem; }

      .admin-title { display: block; }
      .admin-menu { flex-direction: column; overflow: visible; gap: .2rem; }
      .admin-menu .nav-btn { display: flex; width: 100%; white-space: normal; text-align: left; }
    }

    /* Komputer / monitor besar */
    @media (min-width: 1536px) {
      .admin-layout { grid-template-columns: 260px minmax(0, 1fr); gap: 2rem; }
      .site-shell main#app, .site-shell header > div { max-width: 96rem !important; }
    }
    @media (min-width: 1920px) { html { font-size: 112.5%; } }
    @media (min-width: 2560px) {
      html { font-size: 125%; }
      .site-shell main#app, .site-shell header > div { max-width: 112rem !important; }
    }

    /* =====================================================================
       TAMPILAN MODERN: kaca (glass), timbul (raised), animasi, dan tata letak menu
       - Ponsel, laptop, komputer: menu di bawah seperti Dock macOS
       - Tablet (layar sentuh >= 600px): menu di samping
       ===================================================================== */
    html { scroll-behavior: smooth; }
    body { background: #eaf5e2 !important; }
    body::before {
      content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none; will-change: transform;
      background:
        radial-gradient(40% 35% at 14% 18%, rgba(160, 222, 110, .55), transparent 70%),
        radial-gradient(34% 30% at 86% 14%, rgba(255, 224, 140, .50), transparent 70%),
        radial-gradient(46% 40% at 72% 88%, rgba(110, 200, 165, .50), transparent 70%),

      animation: aurora 30s ease-in-out infinite alternate;
    }
    .site-shell { background: transparent !important; }
    @keyframes aurora { to { transform: translate3d(3%, -2%, 0) scale(1.08) rotate(2deg); } }

    /* Header kaca */
    .site-shell > header {
      background: rgba(255, 255, 255, .58) !important;
      -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6);
      border-bottom: 1px solid rgba(255, 255, 255, .7) !important;

    }

    /* Kartu kaca + timbul */
    .card {
      background: linear-gradient(145deg, rgba(255, 255, 255, .74), rgba(255, 255, 255, .46));
      -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, .7);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, .95) inset,
        0 -1px 0 rgba(23, 107, 58, .06) inset,
        0 10px 22px -10px rgba(23, 80, 45, .22),
        0 26px 50px -26px rgba(23, 80, 45, .28);
      transition: transform .28s cubic-bezier(.2, .8, .2, 1), box-shadow .28s;
    }
    main#app article.rounded-2xl, main#app .rounded-2xl.bg-white {
      background: linear-gradient(145deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, .5)) !important;
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .95) inset, 0 12px 24px -12px rgba(23, 80, 45, .3);
      transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s;
    }
    @media (hover: hover) and (pointer: fine) {
      .card:hover { transform: translateY(-2px); box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 16px 30px -10px rgba(23,80,45,.3), 0 34px 60px -28px rgba(23,80,45,.34); }
      main#app article.rounded-2xl:hover { transform: translateY(-4px) scale(1.01); box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 22px 36px -14px rgba(23,80,45,.38); }
    }

    /* Isian */
    .input {
      background: rgba(255, 255, 255, .82);
      border: 1px solid rgba(23, 107, 58, .2);
      box-shadow: inset 0 2px 5px rgba(23, 80, 45, .07);
      transition: box-shadow .2s, border-color .2s, background .2s;
    }
    .input:focus { background: #fff; border-color: #3b8757; box-shadow: inset 0 2px 5px rgba(23,80,45,.05), 0 0 0 4px rgba(120, 200, 110, .28); outline: none; }

    /* Tombol timbul */
    .btn, .nav-btn { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .2s, background .2s, filter .2s; }
    .btn::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, .5), transparent 65%);
      transform: scale(.4); transition: transform .45s, opacity .45s;
    }
    .btn:active::after { opacity: 1; transform: scale(1.7); transition: 0s; }
    .btn-primary {
      background: linear-gradient(180deg, #2f8a4f, #176b3a);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset, 0 -2px 0 rgba(0, 0, 0, .16) inset, 0 10px 18px -8px rgba(23, 107, 58, .65);
    }
    .btn-primary:hover { background: linear-gradient(180deg, #37984a, #14602f); }
    .btn-soft {
      background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(222, 240, 206, .8));
      box-shadow: 0 1px 0 #fff inset, 0 -2px 0 rgba(23, 107, 58, .08) inset, 0 8px 14px -8px rgba(23, 80, 45, .35);
      border: 1px solid rgba(255, 255, 255, .7);
    }
    .btn-danger {
      background: linear-gradient(180deg, #d24545, #b02525);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .3) inset, 0 -2px 0 rgba(0, 0, 0, .18) inset, 0 10px 18px -8px rgba(176, 37, 37, .6);
    }
    @media (hover: hover) and (pointer: fine) {
      .btn:hover:not(:disabled) { transform: translateY(-2px); filter: saturate(1.1); }
    }
    .btn:active:not(:disabled) { transform: translateY(1px) scale(.97); box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 3px 6px -3px rgba(23, 80, 45, .4); }
    .nav-btn { background: rgba(255, 255, 255, .0); }
    .nav-btn:hover, .nav-btn:focus-visible { background: rgba(229, 242, 216, .85); outline-color: rgba(193, 223, 147, .8); }
    .nav-btn.active {
      background: linear-gradient(180deg, #2f8a4f, #176b3a); color: #fff;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .3) inset, 0 10px 18px -10px rgba(23, 107, 58, .7);
    }

    /* Tabel kaca */
    .table-wrap { background: rgba(255, 255, 255, .55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-color: rgba(255, 255, 255, .7); box-shadow: 0 1px 0 #fff inset, 0 10px 20px -14px rgba(23, 80, 45, .35); }
    table { background: transparent; }
    th { background: rgba(231, 244, 220, .85); }
    td, th { border-bottom-color: rgba(190, 214, 180, .45); }
    tbody tr { transition: background .15s; }
    tbody tr:hover { background: rgba(214, 238, 190, .38); }

    /* Modal kaca */
    .modal-layer { background: rgba(8, 32, 16, .42); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: fadeIn .2s ease-out; }
    .modal-box {
      background: linear-gradient(145deg, rgba(255, 255, 255, .98), rgba(244, 250, 240, .97));
      border: 1px solid rgba(255, 255, 255, .8);
      box-shadow: 0 1px 0 #fff inset, 0 30px 80px rgba(0, 0, 0, .32);
      animation: pop .3s cubic-bezier(.2, 1.15, .3, 1);
    }
    /* Tabel di dalam modal: tanpa blur & tanpa animasi supaya seluruh baris tergambar saat digulir */
    .modal-box .table-wrap { -webkit-backdrop-filter: none; backdrop-filter: none; background: #fff; }
    .modal-tabel { animation: none !important; display: flex; flex-direction: column; }
    .modal-tabel-scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; max-height: calc(100vh - 14rem); max-height: calc(100dvh - 14rem); }
    .modal-tabel-scroll .table-wrap { overflow: visible; }
    .modal-tabel-scroll thead th { position: sticky; top: 0; z-index: 1; }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.96); } to { opacity: 1; transform: none; } }
    @media (max-width: 639.98px) {
      .modal-box { animation: sheetUp .34s cubic-bezier(.2, .9, .3, 1); }
      @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
    }

    /* Toast kaca */
    .toast { background: rgba(255, 255, 255, .8); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 18px 40px -12px rgba(10, 50, 25, .45); }

    /* Animasi masuk halaman */
    @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
    main#app > section, main#app > div:not(.dock), .admin-layout > section > * { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
    .admin-layout > section > *:nth-child(2) { animation-delay: .06s; }
    .admin-layout > section > *:nth-child(3) { animation-delay: .12s; }
    .admin-layout > section > *:nth-child(4) { animation-delay: .18s; }
    .admin-layout > section > *:nth-child(n+5) { animation-delay: .24s; }

    /* ---------- Tata letak menu ---------- */
    .dock { display: none; }
    .dock-sep { flex: 0 0 auto; width: 1px; align-self: stretch; margin: 6px 2px; background: rgba(23, 107, 58, .22); }
    .dock-caption { margin: 0 0 2px; text-align: center; font-size: .72rem; font-weight: 700; letter-spacing: .02em; color: #2c5a3c; }

    html[data-layout="dock"] .admin-aside { display: none; }
    html[data-layout="dock"] .admin-layout { grid-template-columns: minmax(0, 1fr); }
    html[data-layout="dock"] body.ada-dock main#app { padding-bottom: calc(122px + env(safe-area-inset-bottom)); }
    html[data-layout="dock"] .toast { bottom: calc(112px + env(safe-area-inset-bottom)); }
    html[data-layout="dock"] .dock {
      display: block; position: fixed; left: 0; right: 0; margin-inline: auto; width: fit-content;
      max-width: calc(100vw - 16px); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 45;
      padding: 6px 10px 10px; border-radius: 28px;
      background: linear-gradient(160deg, rgba(255, 255, 255, .66), rgba(255, 255, 255, .38));
      -webkit-backdrop-filter: blur(26px) saturate(1.8); backdrop-filter: blur(26px) saturate(1.8);
      border: 1px solid rgba(255, 255, 255, .75);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .95) inset, 0 20px 44px -14px rgba(10, 50, 25, .5), 0 4px 12px rgba(10, 50, 25, .14);
      animation: dockIn .55s cubic-bezier(.2, .9, .3, 1) both;
    }
    @keyframes dockIn { from { opacity: 0; transform: translateY(46px); } to { opacity: 1; transform: none; } }
    .dock-inner {
      position: relative; display: flex; align-items: flex-end; gap: 7px; width: 100%; padding: 4px 2px 6px;
      overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity;
    }
    .dock-inner::-webkit-scrollbar { display: none; }
    .dock-inner::before, .dock-inner::after { content: ""; margin: auto; }   /* tengah bila muat, geser bila tidak */
    .dock-item {
      position: relative; flex: 0 0 auto; width: 46px; height: 46px; display: grid; place-items: center;
      border-radius: 14px; border: 0; cursor: pointer; color: #1b5b34; scroll-snap-align: center;
      background: linear-gradient(180deg, rgba(255, 255, 255, .95), rgba(222, 240, 206, .8));
      box-shadow: 0 1px 0 #fff inset, 0 -2px 0 rgba(23, 107, 58, .08) inset, 0 9px 14px -7px rgba(23, 80, 45, .5);
      transform-origin: bottom center; -webkit-tap-highlight-color: transparent;
      transition: transform .2s cubic-bezier(.3, 1.6, .5, 1), box-shadow .2s, background .2s;
    }
    .dock-item svg, .dock-item i { width: 22px; height: 22px; }
    .dock-item.active { color: #fff; background: linear-gradient(180deg, #3aa05d, #176b3a); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 10px 16px -6px rgba(23, 107, 58, .75); }
    .dock-item.active::after { content: ""; position: absolute; bottom: -7px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: #176b3a; }
    .dock-item:active { transform: translateY(-4px) scale(1.12); }
    @media (hover: hover) and (pointer: fine) {
      .dock-inner { overflow: visible; }
      .dock-item:hover { transform: translateY(-11px) scale(1.5); z-index: 2; }
      .dock-item:hover + .dock-item, .dock-item:has(+ .dock-item:hover) { transform: translateY(-5px) scale(1.2); }
      .dock-item::before {
        content: attr(data-label); position: absolute; bottom: calc(100% + 9px); left: 50%; transform: translateX(-50%);
        white-space: nowrap; font-size: .62rem; font-weight: 700; padding: 3px 7px; border-radius: 8px;
        color: #fff; background: rgba(23, 48, 34, .88); opacity: 0; pointer-events: none; transition: opacity .15s;
      }
      .dock-item:hover::before, .dock-item:focus-visible::before { opacity: 1; }
    }

    /* Tablet: menu di samping (kaca) */
    html[data-layout="side"] .dock { display: none; }
    html[data-layout="side"] .admin-layout { grid-template-columns: 236px minmax(0, 1fr); gap: 1.5rem; }
    html[data-layout="side"] .admin-aside { position: sticky; top: calc(var(--hdr-h, 4.25rem) + .75rem); align-self: start; padding: .75rem; }
    html[data-layout="side"] .admin-title { display: block; }
    html[data-layout="side"] .admin-menu { flex-direction: column; overflow: visible; gap: .25rem; }
    html[data-layout="side"] .admin-menu .nav-btn { display: flex; width: 100%; white-space: normal; text-align: left; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

  <script>
    window.addEventListener("error", (e) => {
      console.error("JS Error:", e.message, "di", e.filename + ":" + e.lineno);
      try { toast("Terjadi kesalahan: " + e.message, "error"); } catch {}
    });
    window.addEventListener("unhandledrejection", (e) => {
      console.error("Promise Error:", e.reason?.message || e.reason);
      try { toast("Terjadi kesalahan: " + (e.reason?.message || e.reason), "error"); } catch {}
    });

    function setViewportHeight() {
      document.documentElement.style.setProperty("--vh", `${window.innerHeight * 0.01}px`);
    }
    setViewportHeight();

    // Tata letak menu: ponsel, laptop, komputer = dock di bawah; tablet (layar sentuh, sisi pendek >= 600px) = menu samping.
    // Bisa dipaksa lewat Setting (Otomatis / Menu bawah / Menu samping).
    function hitungTataLetak() {
      let pilihan = "auto";
      try { pilihan = localStorage.getItem("arunika_nav") || "auto"; } catch (e) {}
      let layout;
      if (pilihan === "samping") layout = "side";
      else if (pilihan === "bawah") layout = "dock";
      else {
        const sentuh = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
        const sisiPendek = Math.min(window.innerWidth, window.innerHeight);
        layout = (sentuh && sisiPendek >= 600) ? "side" : "dock";
      }
      document.documentElement.dataset.layout = layout;
    }
    hitungTataLetak();
    window.addEventListener("resize", hitungTataLetak);
    window.addEventListener("orientationchange", hitungTataLetak);

    // Setelah halaman diganti: tandai ada dock (memberi ruang di bawah) dan gulirkan dock ke menu aktif.
    function setelahRender() {
      document.body.classList.toggle("ada-dock", !!document.querySelector("#app .dock"));
      const aktif = document.querySelector("#app .dock-item.active");
      const inner = aktif && aktif.parentElement;
      if (inner && inner.scrollWidth > inner.clientWidth) inner.scrollLeft = aktif.offsetLeft - (inner.clientWidth - aktif.offsetWidth) / 2;
    }
    new MutationObserver(setelahRender).observe(document.getElementById("app"), { childList: true });
    window.addEventListener("resize", setViewportHeight);
    window.addEventListener("orientationchange", setViewportHeight);

    function parseQrTumbler(teks) {

      String(teks ?? "").split(/\r?\n/).forEach((line) => {
        const match = line.match(/^\s*(Nama|Kelas)\s*:\s*(.*)$/i);
        if (!match) return;
        const key = match[1].toLowerCase();
        const value = match[2].trim();
        if (value) values[key] = value;

      if (!values.nama || !values.kelas) return null;
      return { nama: values.nama, kelas: values.kelas };

    function playQrNotice() {
      try {
        if (!qrAudioContext) return;
        if (qrAudioContext.state === "suspended") qrAudioContext.resume();
        const oscillator = qrAudioContext.createOscillator();
        const gain = qrAudioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = 880;
        gain.gain.setValueAtTime(0.25, qrAudioContext.currentTime);
        oscillator.connect(gain);
        gain.connect(qrAudioContext.destination);
        oscillator.start();
        oscillator.stop(qrAudioContext.currentTime + 0.2);

        const k = String(r?.kelas ?? "").trim().toUpperCase();
        if (!k) return;
        map.set(k, (map.get(k) || 0) + (Number(r[field]) || 0));
      });
      return [...map].map(([kelas, v]) => ({ kelas, [field]: Math.round(v * 1000) / 1000 })).sort((a, b) => b[field] - a[field]);
    }

    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function readJsonResponse(res) {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        throw new Error("Respons Apps Script bukan JSON. Periksa URL deployment Web App.");
      }
    }

    async function fetchJsonWithRetry(request, options = {}, cfg = {}) {
      const retries = cfg.retries ?? 2, timeoutMs = cfg.timeoutMs ?? 30000;
      let lastError;
      for (let attempt = 0; attempt <= retries; attempt += 1) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const res = await fetch(request, { ...options, signal: ctrl.signal });
          return await readJsonResponse(res);
        } catch (error) {
          lastError = error;
          const retryable = error?.name === "AbortError" || error instanceof TypeError || error?.message?.includes("bukan JSON");
          if (!retryable || attempt === retries) break;
          await sleep(1200 * (attempt + 1));
        } finally { clearTimeout(timer); }
      }
      if (lastError?.name === "AbortError") throw new Error("Server terlalu lama merespons. Coba lagi sebentar lagi.");
      throw lastError;
    }

    async function apiGet(action, params = {}) {
      const url = requireAppsScriptUrl();
      const query = new URLSearchParams({
        action,
        ...Object.fromEntries(Object.entries(params).filter(([, value]) => value !== "" && value != null))
      });

      // Daftar anggota/kegiatan/jadwal disalin ke perangkat agar absensi tetap bisa dibuka tanpa jaringan.
      const cacheKey = ABS_GET_CACHE.has(action) ? "arunika_cache_" + action : "";
      let json;
      try {
        json = await fetchJsonWithRetry(`${url}?${query.toString()}`);
      } catch (error) {
        if (cacheKey) {
          try { const salinan = localStorage.getItem(cacheKey); if (salinan) return JSON.parse(salinan); } catch {}
        }
        // Status absensi lama tidak bisa diambil saat offline: lanjut dengan sesi kosong (ditandai offline).
        if (action === "getAbsensiSesi" && (navigator.onLine === false || /Failed to fetch|terlalu lama|NetworkError|Load failed/i.test(error.message || ""))) {
          return { records: [], offline: true };
        }
        throw error;
      }
      if (!json.success) throw new Error(json.message || "Tidak dapat terhubung ke server.");
      if (cacheKey) { try { localStorage.setItem(cacheKey, JSON.stringify(json.data)); } catch {} }
      return json.data;
    }
    const ABS_GET_CACHE = new Set(["getAnggota", "getKegiatan", "getJadwalKegiatan"]);


    // ================= ANTRIAN OFFLINE =================
    // Data tambah (sampah/pelanggaran/QR/kebersihan) yang gagal terkirim karena offline
    // disimpan di IndexedDB, lalu dikirim otomatis saat internet kembali.
    // clientId mencegah dobel: backend menolak clientId yang sudah pernah tersimpan.
    const QUEUEABLE_ACTIONS = new Set(["addSampah", "addPelanggaran", "addPelanggaranViaQr", "addKebersihan", "addGreenhouse", "addPenjaga", "saveAbsensi"]);
    const OfflineQueue = (() => {
      let dbp;
      const open = () => dbp || (dbp = new Promise((resolve, reject) => {
        const r = indexedDB.open("arunika-offline", 2);
        r.onupgradeneeded = () => {
          const db = r.result;
          if (!db.objectStoreNames.contains("queue")) db.createObjectStore("queue", { keyPath: "id" });
          if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", { keyPath: "key" });
        };
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      }));
      const tx = async (mode, fn) => {
        const db = await open();
        return new Promise((resolve, reject) => {
          const t = db.transaction("queue", mode);
          const res = fn(t.objectStore("queue"));
          t.oncomplete = () => resolve(res?.result);
          t.onerror = () => reject(t.error);
        });
      };
      return {
        put: (item) => tx("readwrite", s => s.put(item)),
        setMeta: async (key, value) => {
          const db = await open();
          return new Promise((res, rej) => {
            const t = db.transaction("meta", "readwrite");
            t.objectStore("meta").put({ key, value });
            t.oncomplete = () => res(); t.onerror = () => rej(t.error);
          });
        },
        del: (id) => tx("readwrite", s => s.delete(id)),
        all: async () => ((await tx("readonly", s => s.getAll())) || []).sort((a, b) => a.createdAt - b.createdAt)
      };
    })();

    function newClientId() {
      return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
    }

    async function enqueueOffline(action, data) {
      await OfflineQueue.put({ id: data.clientId, action, data, createdAt: Date.now(), failed: false });
      registerBackgroundSync();   // tanpa await agar tidak menghambat simpan
      updateQueueBadge();
      toast("Offline: data disimpan di perangkat dan dikirim otomatis saat online.");
      return { success: true, queued: true, data: { queued: true } };
    }

    // Aplikasi Android: serahkan salinan antrian ke kode native (WorkManager) agar data
    // terkirim di latar belakang walau aplikasi tertutup. ID yang sudah terkirim dihapus dari IndexedDB.
    async function nativeSyncState() {
      const B = window.AndroidBridge;
      if (!B) return;
      try {
        const sent = JSON.parse(B.takeSentIds() || "[]");
        for (const id of sent) await OfflineQueue.del(id);
        B.setUrl(requireAppsScriptUrl());
        B.saveQueue(JSON.stringify(await OfflineQueue.all()));
      } catch {}
    }

    // Minta browser mengirim antrian di latar belakang (aplikasi tertutup) begitu internet/WiFi tersedia.
    async function registerBackgroundSync() {
      try {
        if (window.AndroidBridge) { await nativeSyncState(); return; } // aplikasi Android: WorkManager yang mengirim
        await OfflineQueue.setMeta("url", requireAppsScriptUrl());
        if (!("serviceWorker" in navigator)) return;
        const reg = await navigator.serviceWorker.ready;
        if (reg.sync) await reg.sync.register("arunika-sync");
        if (reg.periodicSync) {
          try { await reg.periodicSync.register("arunika-periodic", { minInterval: 15 * 60 * 1000 }); } catch {}
        }
      } catch {}
    }

    let queueSyncing = false;
    async function syncOfflineQueue(manual = false) {
      if (queueSyncing || navigator.onLine === false) return;
      queueSyncing = true;
      let sent = 0;
      try {
        for (const item of await OfflineQueue.all()) {
          if (item.failed && !manual) continue;
          try {
            await apiPost(item.action, item.data, { fromQueue: true });
            await OfflineQueue.del(item.id);
            sent += 1;
          } catch (error) {
            if (error?.definitive) {            // ditolak server (data tidak valid): jangan blokir antrian
              await OfflineQueue.put({ ...item, failed: true, error: error.message });
            } else break;                        // masalah jaringan: coba lagi nanti
          }
        }
      } catch {} finally {
        queueSyncing = false;
        updateQueueBadge();
      }
      if (sent) {
        toast(`${sent} data offline berhasil dikirim.`);
        try { if (typeof reloadActiveData === "function") reloadActiveData(); } catch {}
      }
    }

    async function updateQueueBadge() {
      if (window.AndroidBridge) await nativeSyncState();
      let el = document.getElementById("offlineBadge");
      if (!el) {
        el = document.createElement("button");
        el.id = "offlineBadge";
        el.type = "button";
        el.style.cssText = "position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:9999;padding:8px 12px;border-radius:999px;font:600 13px 'Work Sans',sans-serif;color:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none";
        el.addEventListener("click", async () => {
          const items = await OfflineQueue.all();
          const failed = items.filter(i => i.failed);
          if (navigator.onLine === false) { toast("Belum ada internet. Data akan dikirim otomatis saat online.", "error"); return; }
          if (failed.length && confirm(`${failed.length} data ditolak server (mis. data tidak valid).\nOK = kirim ulang, Batal = hapus data yang gagal.`)) {
            await syncOfflineQueue(true);
          } else if (failed.length) {
            for (const f of failed) await OfflineQueue.del(f.id);
            updateQueueBadge();
          } else await syncOfflineQueue(true);
        });
        document.body.appendChild(el);
      }
      let items = [];
      try { items = await OfflineQueue.all(); } catch {}
      const failed = items.filter(i => i.failed).length;
      const pending = items.length - failed;
      const offline = navigator.onLine === false;
      if (!offline && !items.length) { el.style.display = "none"; return; }
      el.style.display = "block";
      el.style.background = failed ? "#b91c1c" : (offline ? "#b45309" : "#176b3a");
      el.textContent = (offline ? "Offline" : "Online") + (pending ? ` \u2022 ${pending} menunggu kirim` : "") + (failed ? ` \u2022 ${failed} gagal` : "");
    }

    if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", (e) => {
      if (e.data?.type === "queue-flushed") { updateQueueBadge(); try { reloadActiveData(); } catch {} }
    });
    window.addEventListener("online", () => { updateQueueBadge(); syncOfflineQueue(); });
    window.addEventListener("offline", updateQueueBadge);
    setInterval(() => { if (navigator.onLine !== false) syncOfflineQueue(); }, 30000);
    window.addEventListener("load", () => {
      updateQueueBadge();
      syncOfflineQueue();
      if (!window.AndroidBridge && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
        navigator.serviceWorker.register("sw.js").then(registerBackgroundSync).catch(() => {});
      }
    });

    async function apiPost(action, data, opts = {}) {
      const queueable = QUEUEABLE_ACTIONS.has(action) && !opts.fromQueue;
      if (queueable) data = { ...data, clientId: data.clientId || newClientId() };
      if (queueable && navigator.onLine === false) return enqueueOffline(action, data);

      const url = requireAppsScriptUrl();
      const options = {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action, data })
      };

      let json;
      try {
        // Tidak diulang otomatis; pengiriman ulang ditangani antrian (aman karena ada clientId).
        json = await fetchJsonWithRetry(url, options, { retries: 0, timeoutMs: 60000 });
      } catch (error) {
        // Gagal koneksi / timeout / respons bukan JSON: untuk data tambah, simpan ke antrian offline.
        if (queueable) return enqueueOffline(action, data);
        if (opts.fromQueue) throw error;
        if (/bukan JSON|terlalu lama|Failed to fetch/i.test(error.message)) {
          throw new Error("Respons server tidak terbaca. Data kemungkinan SUDAH tersimpan - cek menu Rekap sebelum menyimpan ulang.");
        }
        throw error;
      }
      if (json.success === false) {
        const err = new Error(json.message || "Tidak dapat memproses data.");
        err.definitive = true;
        throw err;
      }
      if (json.success !== true) throw new Error("Respons server tidak menyatakan keberhasilan.");
      return json;
    }

    async function load(key, action, params = {}) {
      try {
        state.data[key] = await apiGet(action, params);
        return state.data[key];
      } catch (error) {
        state.data[key] = { error: error.message };
        throw error;
      }
    }

    // ===== ABSENSI ANGGOTA (khusus APK Pengurus Inti) =====
    const ABS_STATUS = [["hadir", "Hadir"], ["sakit", "Sakit"], ["izin", "Izin"], ["alpha", "Alpha"]];
    const ABS_HURUF = { hadir: "H", izin: "I", sakit: "S", alpha: "A" };

    const ABS_STATUS_CLASS = {
      hadir: "peer-checked:bg-green-700",
      sakit: "peer-checked:bg-amber-500",

    };

      izin: "bg-sky-100 text-sky-800",

    };
    const ABS_BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
    const ABS_HARI = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

    function absParse(iso) {
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      return m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12) : null;
    }
    function absIso(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }
    function absTgl(t) {
      const d = absParse(t);
      return d ? d.getDate() + " " + ABS_BULAN[d.getMonth()] + " " + d.getFullYear() : String(t);
    }
    function absTglPendek(t) {
      const d = absParse(t);
      return d ? d.getDate() + " " + ABS_BULAN[d.getMonth()].slice(0, 3) : String(t);
    }
    function absHariNama(t) {
      const d = absParse(t);
      return d ? ABS_HARI_SEMUA[d.getDay()] : "";
    }
    function absSenin(t) {
      const d = absParse(t) || new Date();
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
      return absIso(d);
    }
    function absTambah(t, n) {
      const d = absParse(t);
      d.setDate(d.getDate() + n);
      return absIso(d);
    }

    // =====================================================================
    // Tabel absensi (dipakai Absensi Seluruh Anggota & Absensi Jadwal)
    // =====================================================================
    async function absBukaSesi(mode, kegiatanId, tgl, list, opsi) {
      const a = absState();
      const res = await apiGet("getAbsensiSesi", { mode, kegiatanId, tanggal: tgl });
      if (res?.offline) opsi = { ...opsi, catatan: ((opsi.catatan || "") + " MODE OFFLINE: status lama tidak dapat ditampilkan. Absensi yang Anda simpan akan tersimpan di perangkat dan dikirim otomatis saat internet kembali.").trim() };
      const rec = {};
      (res?.records || []).forEach(r => { rec[absLoose(r.nama)] = r; });
      const status = {};
      const sumber = {};
      list.forEach(m => {
        const k = absLoose(m.nama);
        status[k] = rec[k] ? rec[k].status : (opsi.tipeKeb ? "alpha" : "hadir");
        sumber[k] = rec[k] ? rec[k].sumber : "";
      });
      a.sesi = { mode, kegiatanId, tgl, list, status, sumber, nama: absKgtNama(kegiatanId), catatan: opsi.catatan || "" };
      absRenderSesi();
    }

    function absRenderSesi() {
      const a = absState();
      const box = document.getElementById("absSesi");
      const s = a.sesi;
      if (!box || !s) return;
      const rows = s.list.map((m, i) => {
        const k = absLoose(m.nama);
        const cur = s.status[k];
        return `<tr>
          <td>${i + 1}</td>
          <td class="font-semibold">${esc(absNama(m.nama))}${s.sumber[k] === "otomatis" ? ` <span class="badge bg-lime-100 text-green-800">otomatis dari Kebersihan Kelas</span>` : ""}</td>
          <td>${esc(m.kelas)}</td>
          <td><div class="abs-opsi flex flex-wrap gap-2" role="radiogroup" aria-label="Status ${esc(absNama(m.nama))}">
            ${ABS_STATUS.map(([v, l]) => `<label class="cursor-pointer"><input class="peer sr-only" type="radio" name="abs_${i}" value="${v}" data-abs-status="${esc(k)}" ${cur === v ? "checked" : ""}><span class="inline-block rounded-lg border border-green-200 bg-white px-3 py-1.5 text-sm font-bold text-green-900 ${ABS_STATUS_CLASS[v]} peer-checked:border-transparent peer-checked:text-white">${l}</span></label>`).join("")}
          </div></td>
        </tr>`;
      }).join("");
      box.innerHTML = `
        <div class="mb-3 rounded-xl bg-lime-50 p-3 text-green-900">
          <p class="font-bold">${esc(s.nama)} - ${esc(absHariNama(s.tgl))}, ${esc(absTgl(s.tgl))}</p>
          ${s.catatan ? `<p class="text-sm">${esc(s.catatan)}</p>` : ""}
          <p id="absSummary" class="mt-1 text-sm font-semibold"></p>
        </div>
        ${rows ? `<div class="mb-3"><button class="btn btn-soft" type="button" data-abs-setall="hadir">Semua Hadir</button></div>
          <div class="table-wrap"><table class="abs-tabel">
            <thead><tr><th>No</th><th>Nama</th><th>Kelas</th><th>Keterangan</th></tr></thead>
            <tbody>${rows}</tbody>
          </table></div>
          <button class="btn btn-primary mt-4 w-full" type="button" data-abs-save>${icon("save")} Simpan Absensi</button>` : empty("Tidak ada anggota untuk sesi ini.")}`;
      refreshIcons();
      absUpdateSummary();
    }

    function absUpdateSummary() {
      const s = state.abs?.sesi;
      const el = document.getElementById("absSummary");
      if (!s || !el) return;
      const c = { hadir: 0, izin: 0, sakit: 0, alpha: 0 };
      s.list.forEach(m => { const v = s.status[absLoose(m.nama)]; if (c[v] !== undefined) c[v]++; });
      el.textContent = "H " + c.hadir + " | S " + c.sakit + " | I " + c.izin + " | A " + c.alpha + " (dari " + s.list.length + " anggota)";
    }

    async function absSave() {
      const s = absState().sesi;
      if (!s) return;
      const btn = document.querySelector("[data-abs-save]");
      absBusy(btn, "Menyimpan...");
      try {
        const items = s.list.map(m => ({ nama: m.nama, status: s.status[absLoose(m.nama)] || "hadir" }));
        const hasil = await apiPost("saveAbsensi", { mode: s.mode, kegiatanId: s.kegiatanId, tanggal: s.tgl, items });
        if (hasil?.queued) return;   // offline: sudah disimpan di perangkat, sesi tetap terbuka apa adanya
        toast("Absensi disimpan.");
        const tipeKeb = s.mode === "jadwal" && !!absState().jadwal.find(j => j.kegiatanId === s.kegiatanId && j.hari === absHariNama(s.tgl) && (j.tipe === "kebersihan" || j.tipe === "greenhouse" || j.tipe === "tumbler"));
        await absBukaSesi(s.mode, s.kegiatanId, s.tgl, s.list, { tipeKeb, catatan: s.catatan });
      } catch (error) {
        toast(error.message || "Gagal menyimpan absensi.", "error");
      } finally { absIdle(btn); }
    }

    // Satu tabel: baris = anak, kolom = sesi (tanggal). Sel: centang = hadir, I = izin, S = sakit, A = alpha.
    function absBangunTabel(mode, sesi, anggota) {
      const a = absState();
      const idx = a.tabel.length;
      a.tabel.push({ mode, sesi });
      const baris = anggota.map(m => {
        const k = absLoose(m.nama);
        const sel = sesi.map(s => a.peta.get(mode + "|" + s.kegiatanId + "|" + s.tanggal + "|" + k) || null);
        const c = { hadir: 0, izin: 0, sakit: 0, alpha: 0 };
        sel.forEach(r => { if (r && c[r.status] !== undefined) c[r.status]++; });
        const ket = [c.hadir ? "Hadir " + c.hadir + "x" : "", c.sakit ? "Sakit " + c.sakit + "x" : ""].filter(Boolean).join(", ");
        return { m, sel, c, ket };
      });
      const head = sesi.map(s => `<th class="text-center whitespace-nowrap" title="${esc(absTgl(s.tanggal))}">${esc(absTglPendek(s.tanggal))}${s.label ? `<br><span class="text-xs font-normal">${esc(s.label)}</span>` : ""}</th>`).join("");
      const rows = baris.map((b, i) => `<tr>
          <td>${i + 1}</td>
          <td class="font-semibold">${esc(absNama(b.m.nama))}</td>
          <td>${esc(b.m.kelas)}</td>
          ${b.sel.map((r, j) => `<td class="text-center"><button type="button" class="inline-flex h-8 w-8 items-center justify-center rounded-lg font-extrabold ${r ? (ABS_BADGE_CLASS[r.status] || "") : "border border-dashed border-green-300 text-green-300"}" data-abs-cell data-tbl="${idx}" data-sesi="${j}" data-nama="${esc(b.m.nama)}" title="${r ? esc(ABS_LABEL[r.status] || r.status) + " - ketuk untuk edit" : "Belum ada absen - ketuk untuk mengisi"}">${r ? (ABS_SIMBOL[r.status] || "?") : "-"}</button></td>`).join("")}
          <td>${esc(b.ket || "-")}</td>
          <td class="text-center">${b.c.alpha ? `<span class="badge bg-red-100 text-red-800">${b.c.alpha}</span>` : 0}</td>
          <td class="text-center">${b.c.izin}</td>
          <td class="whitespace-nowrap">
            <button class="btn btn-soft px-3 py-2" type="button" data-abs-edit data-tbl="${idx}" data-nama="${esc(b.m.nama)}">${icon("pencil")} Edit</button>
            <button class="btn btn-danger px-3 py-2" type="button" data-abs-hapus data-tbl="${idx}" data-nama="${esc(b.m.nama)}">${icon("trash-2")} Hapus</button>
          </td>
        </tr>`).join("");
      const html = `<div class="table-wrap"><table class="rekap-tabel">
        <thead><tr><th>No</th><th>Nama</th><th>Kelas</th>${head}<th>Keterangan</th><th class="text-center">Jumlah Alpha</th><th class="text-center">Jumlah Izin</th><th>Aksi</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
      const text = ["No", "Nama", "Kelas"].concat(sesi.map(s => absTglPendek(s.tanggal) + (s.label ? " (" + s.label + ")" : "")), ["Keterangan", "Jumlah Alpha", "Jumlah Izin"]).join("\t") + "\n"
        + baris.map((b, i) => [i + 1, absNama(b.m.nama), b.m.kelas].concat(b.sel.map(r => (r ? ABS_SIMBOL[r.status] : "-")), [b.ket || "-", b.c.alpha, b.c.izin]).join("\t")).join("\n");
      const pdfHead = ["No", "Nama", "Kelas"].concat(sesi.map(s => absTglPendek(s.tanggal) + (s.label ? "\n" + s.label : "")), ["Keterangan", "Alpha", "Izin"]);
      const pdfBody = baris.map((b, i) => [i + 1, absNama(b.m.nama), b.m.kelas].concat(b.sel.map(r => (r ? (ABS_HURUF[r.status] || "?") : "-")), [b.ket || "-", b.c.alpha, b.c.izin]));
      return { html, text, pdf: { head: pdfHead, body: pdfBody, nSesi: sesi.length } };
    }

    function absRekapSemuaBlok(recs, anggota, dari, sampai) {
      const sesiMap = new Map();
      recs.forEach(r => {
        if (r.mode !== "semua" || r.tanggal < dari || r.tanggal > sampai) return;
        const k = r.tanggal + "|" + r.kegiatanId;
        if (!sesiMap.has(k)) sesiMap.set(k, { tanggal: r.tanggal, kegiatanId: r.kegiatanId, label: absKgtNama(r.kegiatanId) });
      });
      const sesi = Array.from(sesiMap.values()).sort((x, y) => (x.tanggal < y.tanggal ? -1 : x.tanggal > y.tanggal ? 1 : 0) || (x.label < y.label ? -1 : 1));
      if (!sesi.length) return [{ pesan: "Belum ada absensi seluruh anggota pada " + absTgl(dari) + " sampai " + absTgl(sampai) + "." }];
      return [Object.assign({ judul: "Absensi Seluruh Anggota" }, absBangunTabel("semua", sesi, anggota))];
    }

    function absRekapJadwalBlok(recs, anggota, dari, sampai, kgtFilter) {
      const a = absState();
      const kgtIds = new Set();
      a.jadwal.forEach(j => kgtIds.add(j.kegiatanId));
      recs.forEach(r => { if (r.mode === "jadwal") kgtIds.add(r.kegiatanId); });
      const out = [];
      Array.from(kgtIds).filter(id => !kgtFilter || id === kgtFilter)
        .sort((x, y) => (absKgtNama(x) < absKgtNama(y) ? -1 : 1))
        .forEach(kid => {
          const hariSet = new Set(a.jadwal.filter(j => j.kegiatanId === kid).map(j => j.hari));
          recs.forEach(r => { if (r.mode === "jadwal" && r.kegiatanId === kid) hariSet.add(absHariNama(r.tanggal)); });
          ABS_HARI.filter(h => hariSet.has(h)).forEach(h => {
            const j = a.jadwal.find(x => x.kegiatanId === kid && x.hari === h);
            const rs = recs.filter(r => r.mode === "jadwal" && r.kegiatanId === kid && absHariNama(r.tanggal) === h && r.tanggal >= dari && r.tanggal <= sampai);
            const judul = absKgtNama(kid) + " - Hari " + h;
            if (!rs.length) { out.push({ judul, pesan: "Belum ada absensi pada rentang tanggal ini." }); return; }
            const sesi = Array.from(new Set(rs.map(r => r.tanggal))).sort().map(t => ({ tanggal: t, kegiatanId: kid, label: "" }));
            const nama = new Set((j ? j.peserta : []).map(absLoose));
            rs.forEach(r => nama.add(absLoose(r.nama)));
            const baris = anggota.filter(m => nama.has(absLoose(m.nama)));
            out.push(Object.assign({ judul }, absBangunTabel("jadwal", sesi, baris)));
          });
        });
      return out.length ? out : [{ pesan: "Belum ada jadwal atau absensi jadwal." }];
    }

    function absRekapOut() {
      const a = absState();
      const out = document.getElementById("absRekapOut");
      if (!out || !a.data) return;
      if (!a.rekapDari || !a.rekapSampai || a.rekapDari > a.rekapSampai) { out.innerHTML = `<section class="card p-5">${empty("Rentang tanggal tidak valid.")}</section>`; a.rekapText = ""; a.rekapBlok = []; return; }
      a.tabel = [];
      const anggota = a.roster.slice().sort(absUrutAnggota);
      const recs = a.data.records || [];
      const blok = a.rekapTab === "jadwal"
        ? absRekapJadwalBlok(recs, anggota, a.rekapDari, a.rekapSampai, a.rekapKgtId)
        : absRekapSemuaBlok(recs, anggota, a.rekapDari, a.rekapSampai);
      a.rekapBlok = blok;
      a.rekapText = blok.map(b => (b.judul ? b.judul.toUpperCase() + "\n" : "") + (b.text || b.pesan || "")).join("\n\n");
      out.innerHTML = blok.map(b => `<section class="card mb-5 p-5">
          ${b.judul ? `<h3 class="mb-3 text-lg font-extrabold text-green-950">${esc(b.judul)}</h3>` : ""}
          ${b.html || `<p class="text-green-800">${esc(b.pesan || "")}</p>`}
        </section>`).join("")
        + (blok.some(b => b.html) ? `<p class="mb-3 text-sm text-green-800">\u2713 = hadir, S = sakit, I = izin, A = alpha, - = belum ada catatan. Ketuk simbol untuk mengedit.</p>
          <div class="flex flex-wrap gap-2"><button class="btn btn-primary" type="button" data-pdf="absensi">${icon("file-down")} Unduh PDF</button>
          <button class="btn btn-soft" type="button" data-abs-copy>${icon("copy")} Salin Tabel</button></div>` : "");
      refreshIcons();
    }

    async function absRefreshRekap() {
      await absRekapMuat();
      absRekapDraw();
    }

    async function absCopy() {
      const text = absState().rekapText || "";
      try {
        await navigator.clipboard.writeText(text);
        toast("Tabel rekap disalin.");
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); toast("Tabel rekap disalin."); }
        catch { toast("Tidak dapat menyalin teks.", "error"); }
        ta.remove();
      }
    }

    // ---------- Edit keterangan / hapus absen (per nama, per tanggal) ----------
    function absOpenModal(tblIdx, nama, sesiIdx, mode) {
      const a = absState();
      const t = a.tabel[Number(tblIdx)];
      if (!t) return;
      const k = absLoose(nama);
      const opsi = t.sesi.map((s, i) => ({ s, i, rec: a.peta.get(t.mode + "|" + s.kegiatanId + "|" + s.tanggal + "|" + k) || null }))
        .filter(o => (mode === "hapus" ? o.rec : true));
      if (!opsi.length) { toast(mode === "hapus" ? "Belum ada absen yang bisa dihapus untuk anak ini." : "Tidak ada tanggal yang bisa diisi.", "error"); return; }
      const pilih = (sesiIdx !== "" && sesiIdx != null && opsi.some(o => o.i === Number(sesiIdx))) ? Number(sesiIdx) : opsi[0].i;
      const anggota = a.roster.find(m => absLoose(m.nama) === k);
      const statusPer = {};
      opsi.forEach(o => { statusPer[o.i] = o.rec ? o.rec.status : "hadir"; });
      a.modal = { tblIdx: Number(tblIdx), nama, mode, statusPer };
      const radios = ABS_STATUS.map(([v, l]) => `<label class="cursor-pointer"><input class="peer sr-only" type="radio" name="absModalStatus" value="${v}" ${statusPer[pilih] === v ? "checked" : ""}><span class="inline-block rounded-lg border border-green-200 bg-white px-3 py-2 font-bold text-green-900 ${ABS_STATUS_CLASS[v]} peer-checked:border-transparent peer-checked:text-white">${ABS_HURUF[v]} - ${l}</span></label>`).join("");
      setModal(`
        <div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="absModalTitle">
          <div class="modal-box p-6">
            <div class="flex items-center justify-between gap-4">
              <h2 id="absModalTitle" class="text-2xl font-extrabold text-green-950">${mode === "hapus" ? "Hapus Absen" : "Edit Keterangan"}</h2>
              <button class="btn btn-soft" type="button" data-close-modal>${icon("x")} Tutup</button>
            </div>
            <p class="mt-3 font-bold text-green-950">${esc(absNama(nama))} <span class="font-normal text-green-800">(${esc(anggota?.kelas || "")})</span></p>
            <p class="text-sm text-green-800">${esc(ABS_MODE_LABEL[t.mode] || "")}</p>
            <div class="mt-4">

    function absModalSesi() {
      const m = absState().modal;
      const t = m ? absState().tabel[m.tblIdx] : null;
      const idx = Number(document.getElementById("absModalTgl")?.value);
      return t && t.sesi[idx] ? { t, s: t.sesi[idx] } : null;
    }

    async function absModalSave() {
      const m = absState().modal;
      const btn = document.querySelector("[data-abs-modal-save]");
      const cur = absModalSesi();
      const status = document.querySelector('input[name="absModalStatus"]:checked')?.value || "";
      if (!m || !cur || !status) { toast("Pilih tanggal dan keterangan.", "error"); return; }
      absBusy(btn, "Menyimpan...");
      try {
        await apiPost("editAbsensi", { mode: cur.t.mode, kegiatanId: cur.s.kegiatanId, tanggal: cur.s.tanggal, nama: m.nama, status });
        closeModal();
        toast("Keterangan diubah.");
        await absRefreshRekap();
      } catch (error) {
        toast(error.message || "Gagal menyimpan keterangan.", "error");
        absIdle(btn);
      }
    }

    async function absModalDelete(btn) {
      const m = absState().modal;
      const cur = absModalSesi();
      if (!m || !cur) return;
      if (!absArmed(btn, "Yakin hapus? Ketuk lagi")) return;
      absBusy(btn, "Menghapus...");
      try {
        await apiPost("deleteAbsensi", { mode: cur.t.mode, kegiatanId: cur.s.kegiatanId, tanggal: cur.s.tanggal, nama: m.nama });
        closeModal();
        toast("Absen tanggal tersebut dihapus.");
        await absRefreshRekap();
      } catch (error) {
        toast(error.message || "Gagal menghapus absen.", "error");
        btn.dataset.armed = "";
        absIdle(btn);
      }
    }

                <td>${esc(r.kelas)}</td>

                <td>${esc(r.terakhir)}</td>
                <td class="text-sm text-green-800">${esc((r.detail || []).map(d => d.kegiatanNama + " (alpha s/d " + absTglPendek(d.sampai) + ")").join("; "))}</td>
              </tr>`).join("")}</tbody></table></div>` : empty("Belum ada riwayat hukuman.")}</div>
          </section>`;
        refreshIcons();
      } catch (error) { out.innerHTML = `<section class="card p-5"><p class="font-semibold text-red-700">${esc(error.message || "Gagal memuat hukuman.")}</p></section>`; }

    async function absTandaiHukuman(btn) {
      if (!absArmed(btn, "Yakin? Ketuk lagi")) return;
      absBusy(btn, "Menyimpan...");
      try {
        await apiPost("tandaiHukumanAbsensi", { mode: btn.dataset.mode, kegiatanId: btn.dataset.kgt, nama: btn.dataset.nama });
        toast("Status diubah: sudah menjalankan hukuman.");

        toast(error.message || "Gagal menyimpan status hukuman.", "error");

        absIdle(btn);

    // =====================================================================
    // Event
    // =====================================================================
    document.addEventListener("change", (event) => {
      if (!IS_INTI) return;
      const a = state.abs;
      const radio = event.target.closest?.("[data-abs-status]");
      if (radio && a?.sesi) { a.sesi.status[radio.dataset.absStatus] = radio.value; absUpdateSummary(); return; }
      if (!a) return;
      const id = event.target.id;
      if (id === "jdPeserta" || event.target.classList?.contains("jdPeserta")) { absJdHitung(); return; }
      if (id === "absDate") { a.tanggal = event.target.value; a.sesi = null; const box = document.getElementById("absSesi"); if (box) box.innerHTML = ""; absUpdateHariLabel(); return; }
      if (id === "absJKgt" || id === "absJDate") {
        if (id === "absJKgt") a.jKgtId = event.target.value; else a.tanggalJ = event.target.value;
        a.sesi = null; const box = document.getElementById("absSesi"); if (box) box.innerHTML = "";
        absJInfoRender();
        return;
      }
      if (id === "absFrom") { a.rekapDari = event.target.value; return; }
      if (id === "absTo") { a.rekapSampai = event.target.value; return; }
      if (id === "absRekapKgt") { a.rekapKgtId = event.target.value; return; }
      if (id === "absModalTgl" && a.modal?.statusPer) {
        const target = document.querySelector('input[name="absModalStatus"][value="' + (a.modal.statusPer[Number(event.target.value)] || "hadir") + '"]');
        if (target) target.checked = true;
      }
    });

    document.addEventListener("input", (event) => {
      if (!IS_INTI) return;
      const id = event.target.id;
      if (id === "angFilter") { absAnggotaList(); return; }
      if (id === "jdCari") { absJdFilter(); return; }
      if (id === "absKgtCari") { absState().kgtId = ""; absKgtHasilRender(); }
    });

    document.addEventListener("focusin", (event) => {
      if (IS_INTI && event.target.id === "absKgtCari" && !absState().kgtId) absKgtHasilRender();
    });

    document.addEventListener("click", (event) => {
      if (!IS_INTI) return;
      const t = event.target;
      const a = absState();
      let el;
      if ((el = t.closest("[data-abs-pilihkgt]"))) {
        a.kgtId = el.dataset.absPilihkgt;
        a.sesi = null;
        const input = document.getElementById("absKgtCari");
        if (input) input.value = absKgtNama(a.kgtId);
        const box = document.getElementById("absKgtHasil"); if (box) { box.classList.add("hidden"); box.innerHTML = ""; }
        const sesiBox = document.getElementById("absSesi"); if (sesiBox) sesiBox.innerHTML = "";
        return;
      }
      if ((el = t.closest("[data-abs-dtab]"))) { a.dtab = el.dataset.absDtab; if (a.dtab !== "jadwal") a.editJadwalId = ""; absDataDraw(); return; }
      if (t.closest("[data-abs-addanggota]")) { absAddAnggota(); return; }
      if ((el = t.closest("[data-abs-ang-edit]"))) { absOpenEditAnggota(el.dataset.nama); return; }
      if (t.closest("[data-abs-ang-save]")) { absSaveAnggota(); return; }
      if ((el = t.closest("[data-abs-ang-del]"))) { absDeleteAnggota(el); return; }
      if (t.closest("[data-abs-addkgt]")) { absAddKegiatan(); return; }
      if ((el = t.closest("[data-abs-kgt-edit]"))) { absOpenEditKegiatan(el.dataset.absKgtEdit); return; }
      if (t.closest("[data-abs-kgt-save]")) { absSaveKegiatan(); return; }
      if ((el = t.closest("[data-abs-kgt-del]"))) { absDeleteKegiatan(el); return; }
      if (t.closest("[data-abs-jd-simpan]")) { absSimpanJadwal(); return; }
      if ((el = t.closest("[data-abs-jd-edit]"))) { a.editJadwalId = el.dataset.absJdEdit; absDataDraw(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      if (t.closest("[data-abs-jd-batal]")) { a.editJadwalId = ""; absDataDraw(); return; }
      if ((el = t.closest("[data-abs-jd-del]"))) { absDeleteJadwal(el); return; }
      if (t.closest("[data-abs-jd-pilihtampil]")) {
        document.querySelectorAll(".jdItem:not(.hidden) .jdPeserta").forEach(c => { c.checked = true; });
        absJdHitung();
        return;
      }
      if (t.closest("[data-abs-jd-kosong]")) {
        document.querySelectorAll(".jdPeserta").forEach(c => { c.checked = false; });
        absJdHitung();
        return;
      }
      if (t.closest("[data-abs-load]")) { absLoadSemua(); return; }
      if (t.closest("[data-abs-jload]")) { absLoadJadwalSesi(); return; }
      if ((el = t.closest("[data-abs-jhari]"))) {
        const idx = ABS_HARI.indexOf(el.dataset.absJhari);
        const tglEl = document.getElementById("absJDate");
        if (idx >= 0 && tglEl) {
          const tgl = absTambah(absSenin(tglEl.value || a.tanggalJ), idx);
          tglEl.value = tgl;
          a.tanggalJ = tgl;
          a.sesi = null;
          const box = document.getElementById("absSesi"); if (box) box.innerHTML = "";
          absJInfoRender();
        }
        return;
      }
      if ((el = t.closest("[data-abs-setall]"))) {
        if (a.sesi) { a.sesi.list.forEach(m => { a.sesi.status[absLoose(m.nama)] = el.dataset.absSetall; }); absRenderSesi(); }
        return;
      }
      if (t.closest("[data-abs-save]")) { absSave(); return; }
      if (t.closest("[data-abs-retry]")) { render(); return; }
      if ((el = t.closest("[data-abs-rekaptab]"))) { a.rekapTab = el.dataset.absRekaptab; absRekapDraw(); return; }
      if (t.closest("[data-abs-rekap-apply]")) {
        a.rekapDari = document.getElementById("absFrom")?.value || a.rekapDari;
        a.rekapSampai = document.getElementById("absTo")?.value || a.rekapSampai;
        a.rekapKgtId = document.getElementById("absRekapKgt")?.value || "";
        absRekapOut();
        return;
      }
      if (t.closest("[data-abs-copy]")) { absCopy(); return; }
      if ((el = t.closest("[data-abs-cell]"))) { absOpenModal(el.dataset.tbl, el.dataset.nama, el.dataset.sesi, "edit"); return; }
      if ((el = t.closest("[data-abs-edit]"))) { absOpenModal(el.dataset.tbl, el.dataset.nama, "", "edit"); return; }
      if ((el = t.closest("[data-abs-hapus]"))) { absOpenModal(el.dataset.tbl, el.dataset.nama, "", "hapus"); return; }
      if (t.closest("[data-abs-modal-save]")) { absModalSave(); return; }
      if ((el = t.closest("[data-abs-modal-delete]"))) { absModalDelete(el); return; }
      if ((el = t.closest("[data-abs-hukuman]"))) { absTandaiHukuman(el); }
    });

    // Tinggi header dipakai agar menu admin yang menempel (sticky) tidak tertimpa header.
    (() => {
      const header = document.querySelector("header");
      if (!header) return;
      const set = () => document.documentElement.style.setProperty("--hdr-h", header.offsetHeight + "px");
      set();
      if (window.ResizeObserver) new ResizeObserver(set).observe(header);
      window.addEventListener("resize", set);
    })();

    // Ponsel/tablet: bilah menu admin digeser agar menu yang sedang aktif selalu terlihat.
    new MutationObserver(() => {
      const aktif = document.querySelector(".admin-menu .nav-btn.active");
      if (aktif && window.matchMedia("(max-width: 1023.98px)").matches) aktif.scrollIntoView({ inline: "center", block: "nearest" });
    }).observe(document.getElementById("app"), { childList: true });

        ["sampah", "recycle", "Sampah Botol"],
        ["pelanggaran", "cup-soda", "Pelanggaran Tumbler"],

    function rankingCards(items, type = "points", expandKey = "ranking", moreLabel = "Lihat Peringkat Lainnya") {
      const rows = Array.isArray(items) ? items : [];
      if (!rows.length) return empty();

      const colors = ["#d59c15", "#80909c", "#a86635"];
      const isWeight = type === "weight";
      const extraRows = rows.slice(3);

      const card = (row, index) => {
        const kelas = row.kelas;
        const value = isWeight ? row.totalKg : row.poin;
        const color = colors[index] || "#176b3a";
        return `
          <article class="rounded-2xl border border-green-100 bg-white p-5 shadow-sm" style="border-top:5px solid ${color}">
            <div class="flex items-center justify-between">
              <span class="grid h-9 w-9 place-items-center rounded-full font-extrabold text-white" style="background:${color}">${index + 1}</span>
              ${icon(isWeight ? "recycle" : "leaf", "h-6 w-6")}
            </div>
            <h3 class="mt-5 text-xl font-extrabold text-green-950">${esc(kelas)}</h3>
            <p class="mt-1 font-semibold text-green-700">${esc(angkaId(value))} ${isWeight ? "kg" : "poin"}</p>
          </article>`;
      };

      return `<div class="grid gap-4 md:grid-cols-3" data-ranking-list="${esc(expandKey)}">
        ${rows.slice(0, 3).map(card).join("")}
      </div>
      ${extraRows.length ? `<button class="btn btn-soft mt-4" type="button" data-ranking-toggle="${esc(expandKey)}" aria-expanded="false">${esc(moreLabel)}</button>` : ""}`;
    }

    function kebersihanResultTable(riwayat) {
      const rows = Array.isArray(riwayat) ? riwayat : [];
      if (!rows.length) return empty("Belum ada riwayat kebersihan untuk kelas ini.");

      const photoCell = (viewUrl, thumbUrl, alt) => viewUrl
        ? `<a href="${esc(viewUrl)}" target="_blank" rel="noopener"><img src="${esc(thumbUrl)}" alt="${esc(alt)}" class="h-14 w-14 rounded-lg object-cover"></a>`
        : "-";

      const body = rows.map(r => `
        <tr>
          <td>${esc(formatDate(r.tanggal))}</td>
          <td><b>${esc(r.kelas)}</b></td>
          <td>${r.kipasMati ? '<span class="font-semibold text-green-700">Kipas Mati</span>' : '<span class="font-semibold text-red-700">Kipas Menyala</span>'}</td>
          <td>${r.bersih ? '<span class="font-semibold text-green-700">Bersih</span>' : '<span class="font-semibold text-red-700">Kotor</span>'}</td>
          <td>${photoCell(r.fotoViewURL, r.fotoURL, "Foto bukti kelas")}</td>
          <td>${photoCell(r.fotoKipasViewURL, r.fotoKipasURL, "Foto bukti kipas menyala")}</td>

      return `<div class="table-wrap"><table><thead><tr>
        <th>Tanggal</th><th>Kelas</th><th>Status Kipas</th><th>Kebersihan</th><th>Foto Kelas</th><th>Foto Kipas</th>
      </tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function championCards(items) {
      const rows = Array.isArray(items) ? items.slice(0, 3) : [];
      if (!rows.length) return empty();

      const colors = ["#d59c15", "#80909c", "#a86635"];
      return `<div class="grid gap-4 md:grid-cols-3">
        ${rows.map((row, index) => `
          <article class="rounded-2xl border border-green-100 bg-white p-5 shadow-sm" style="border-top:5px solid ${colors[index]}">
            <div class="flex items-center justify-between">
              <span class="grid h-9 w-9 place-items-center rounded-full font-extrabold text-white" style="background:${colors[index]}">${index + 1}</span>
              ${icon("trophy", "h-6 w-6")}

            <h3 class="mt-5 text-xl font-extrabold text-green-950">${esc(row.kelas)}</h3>
            <div class="mt-2 space-y-1 text-sm text-green-800">

    }

      else if (state.route === "sampah") renderSampah();
      else if (state.route === "pelanggaran") renderPelanggaran();
      else if (state.route === "kebersihan") renderKebersihan();
      else if (state.route === "greenhouse") renderGreenhouse();

      else if (state.route === "settings") renderSettings();
      else if (IS_INTI && state.route === "absensi") renderAbsensi();
      else if (IS_INTI && state.route === "absensiJadwal") renderAbsensiJadwal();

      document.querySelectorAll("#navDataCenterBtn, #navDataCenterBtnMobile").forEach(el => el.classList.toggle("active", state.route !== "beranda"));

      refreshIcons();

        publicLangSelect.value = getCurrentLang();
        publicLangSelect.addEventListener("change", (event) => {
          localStorage.setItem("PUBLIC_LANG", event.target.value);
          render();
        });
      }

      let hasCache = false;
      try {
        const draw = (g) => {
          const cleanRows = padClasses(g?.cleanRank, "poin");
          const bottleRows = padClasses(g?.bottleRank, "totalKg");
          state.data.cleanRank = cleanRows;
          state.data.bottleRank = bottleRows;
          document.getElementById("publicClean").innerHTML = rankingCards(cleanRows, "points", "public-clean", t("lihatLainnya"));
          document.getElementById("publicBottle").innerHTML = rankingCards(bottleRows, "weight", "public-bottle", t("lihatLainnya"));
          refreshIcons();
        };
        // Tampilkan data tersimpan dulu (instan), lalu perbarui dari server (1 request saja).
        try { const c = JSON.parse(localStorage.getItem(RANK_CACHE_KEY) || "null"); if (c) { draw(c); hasCache = true; } } catch {}
        const fresh = await load("rankGabungan", "getPeringkatGabungan");
        try { localStorage.setItem(RANK_CACHE_KEY, JSON.stringify(fresh)); } catch {}
        draw(fresh);
      } catch (error) {
        if (!hasCache) {
          document.getElementById("publicClean").innerHTML = `<p class="text-red-700">${esc(error.message)}</p>`;
          document.getElementById("publicBottle").innerHTML = `<p class="text-red-700">${esc(error.message)}</p>`;
        }
      }

      refreshIcons();
    }

    function limitRecapTable(targetId, title) {
      const target = document.getElementById(targetId);
      const table = target?.querySelector("table");
      const body = table?.querySelector("tbody");
      if (!table || !body || body.rows.length <= 10) return;
      const allRows = body.innerHTML;
      const headers = [...table.querySelectorAll("thead th")].map(cell => cell.textContent.trim());
      [...body.rows].slice(10).forEach(row => row.classList.add("hidden"));
      target.insertAdjacentHTML("beforeend", `<button class="btn btn-soft mt-4" type="button" data-full-table-title="${esc(title)}">Lihat Semua Data</button>`);
      target.dataset.fullRows = allRows;
      target.dataset.fullHeaders = JSON.stringify(headers);
    }

        bottle: document.getElementById("recapBottle"),
        violation: document.getElementById("recapViolation"),
        clean: document.getElementById("recapClean"),
        greenhouse: document.getElementById("recapGreenhouse")
      };
      Object.entries(panels).forEach(([key, panel]) => panel?.classList.toggle("hidden", key !== active));
      document.querySelectorAll("[data-recap-tab]").forEach(button => {
        const selected = button.dataset.recapTab === active;
        button.classList.toggle("active", selected);
        button.setAttribute("aria-selected", String(selected));

    async function compress(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = (event) => {
          const image = new Image();

          image.onload = () => {
            const max = 800;
            const scale = Math.min(1, max / Math.max(image.width, image.height));
            const canvas = document.createElement("canvas");

            canvas.width = image.width * scale;
            canvas.height = image.height * scale;

            canvas.getContext("2d").drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", .65));
          };

          image.onerror = reject;
          image.src = event.target.result;
        };

        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

      document.getElementById("qrFullscreen")?.remove();

      violationQrScannerStopping = false;
      violationQrScannerStarting = false;

    async function saveSampahForm() {
      const form = document.getElementById("sampahForm");
      if (!form) return;
      const button = document.getElementById("saveSampahBtn");
      clearOperationMessage();
      setSaveBusy(button);
      try {
        const data = Object.fromEntries(new FormData(form));
        lengkapi([
          { label: "Tanggal Pengumpulan", ok: !!data.tanggal, id: "s-date" },
          { label: "Kelas", ok: !!data.kelas, id: "s-class" },
          { label: "Berat", ok: String(data.berat ?? "").trim() !== "", id: "s-weight" }
        ]);
        const berat = Number(data.berat);
        if (!Number.isFinite(berat) || berat < 0) throw new Error("Berat harus berupa angka valid.");

        await apiPost("addSampah", {
          tanggal: data.tanggal,
          kelas: data.kelas,
          berat,
          satuan: data.satuan
        });

        form.reset();
        showOperationMessage("Berhasil disimpan", "success", "operationMessage", form);
        toast("Data sampah disimpan.");
      } catch (error) {
        showOperationMessage(error.message || "Gagal menyimpan data.", "error", "operationMessage", form);
        toast(error.message || "Gagal menyimpan data.", "error");
      } finally {
        restoreSaveButton(button);
      }
    }
