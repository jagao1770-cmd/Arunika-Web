    };
    // Hidroponik: 1 sampai 6 petugas, sama seperti Kebersihan Kelas.
    const GH_PETUGAS_KEYS = Array.from({ length: 6 }, (_, i) => "gh" + (i + 1));
    GH_PETUGAS_KEYS.forEach((key, i) => {
      const n = i === 0 ? "" : String(i + 1);
      PICKERS[key] = { kelas: "g-officer" + n + "-class", search: "g-officer" + n + "-search", hidden: "g-officer" + n, selected: "g-officer" + n + "-selected", results: "g-officer" + n + "-results" };
    });
    // Kebersihan Kelas: 1 sampai 6 petugas, masing-masing punya pilihan kelas sendiri di sebelah kolom nama.
    const KB_MAX_PETUGAS = 6;
    const KB_PETUGAS_KEYS = Array.from({ length: KB_MAX_PETUGAS }, (_, i) => "petugas" + (i + 1));
    KB_PETUGAS_KEYS.forEach((key, i) => {
      const n = i === 0 ? "" : String(i + 1);
      PICKERS[key] = { kelas: "k-officer" + n + "-class", search: "k-officer" + n + "-search", hidden: "k-officer" + n, selected: "k-officer" + n + "-selected", results: "k-officer" + n + "-results" };
    });
    // Presensi penjaga tumbler: 1 sampai 6 penjaga, sama seperti Kebersihan Kelas.
    const PJ_PETUGAS_KEYS = Array.from({ length: 6 }, (_, i) => "pj" + (i + 1));
    PJ_PETUGAS_KEYS.forEach((key, i) => {
      const n = i === 0 ? "" : String(i + 1);
      PICKERS[key] = { kelas: "pj-officer" + n + "-class", search: "pj-officer" + n + "-search", hidden: "pj-officer" + n, selected: "pj-officer" + n + "-selected", results: "pj-officer" + n + "-results" };
    });
    // Petugas dalam satu form tidak boleh orang yang sama: daftar nama yang sudah dipilih di kolom lain.
    const namaPasangan = (key) => {
      const grup = KB_PETUGAS_KEYS.includes(key) ? KB_PETUGAS_KEYS : (GH_PETUGAS_KEYS.includes(key) ? GH_PETUGAS_KEYS : (PJ_PETUGAS_KEYS.includes(key) ? PJ_PETUGAS_KEYS : null));
      if (!grup) return [];
      const lain = grup.filter(k => k !== key).map(k => document.getElementById(PICKERS[k].hidden)?.value || "").filter(Boolean);
      return PJ_PETUGAS_KEYS.includes(key) ? lain.concat(state.penjagaHariIni || []) : lain;   // 1 nama hanya 1x per hari
    };
    const pickerEl = (key, part) => document.getElementById(PICKERS[key][part]);
    const pickerKeysById = (id, part) => Object.keys(PICKERS).filter(k => PICKERS[k][part] === id);

    function normalisasiNama(value) {
      return String(value ?? "").toLowerCase().replace(/\s+/g, " ").trim();
    }

    function cariSiswaDiKelas(kelas, query) {
      const tokens = normalisasiNama(query).split(" ").filter(Boolean);
      return (SISWA_PER_KELAS[kelas] || []).filter((nama) => {
        const lower = nama.toLowerCase();
        return tokens.every((token) => lower.includes(token));
      });
    }

    // Satu baris petugas Kebersihan Kelas: pilihan kelas di sebelah kiri, kolom pencarian nama di kanan.
    function petugasBarisHtml(i) {
      const p = PICKERS["petugas" + i];
      return `<div id="k-petugas-row-${i}" class="${i > 1 ? "hidden" : ""}">
        <label for="${p.search}">Nama Petugas ${i}</label>
        <div class="mt-1 grid grid-cols-[6.5rem_1fr] gap-2">
          <select id="${p.kelas}" class="input" aria-label="Kelas petugas ${i}">${classOptions("", "Kelas")}${IS_INTI ? '<option value="Tambahan">Tambahan</option>' : ""}</select>
          <input id="${p.search}" class="input" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Pilih kelas dulu" aria-controls="${p.results}" aria-autocomplete="list" disabled>
        </div>
        <input id="${p.hidden}" type="hidden">
        <p id="${p.selected}" class="mt-2 hidden rounded-xl border border-green-200 bg-green-50 p-2 text-green-950" aria-live="polite"></p>
        <div id="${p.results}" class="mt-2 hidden max-h-60 overflow-y-auto rounded-xl border border-green-100 bg-white" role="listbox" aria-label="Hasil pencarian nama"></div>
      </div>`;
    }

    function studentPickerHtml(key, label) {
      const p = PICKERS[key];
      return `<div>
        <label for="${p.search}">${esc(label)}</label>
        <input id="${p.search}" class="input mt-1" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Pilih kelas dulu" aria-controls="${p.results}" aria-autocomplete="list" disabled>
        <input id="${p.hidden}" type="hidden">
        <p id="${p.selected}" class="mt-2 hidden rounded-xl border border-green-200 bg-green-50 p-2 text-green-950" aria-live="polite"></p>
        <div id="${p.results}" class="mt-2 hidden max-h-60 overflow-y-auto rounded-xl border border-green-100 bg-white" role="listbox" aria-label="Hasil pencarian nama"></div>
      </div>`;
    }

    function renderHasilCariSiswa(key) {
      const kelas = pickerEl(key, "kelas")?.value || "";
      const search = pickerEl(key, "search");
      const box = pickerEl(key, "results");
      if (!search || !box) return;
      if (!kelas) { box.classList.add("hidden"); box.innerHTML = ""; return; }
      // Dua petugas tidak boleh orang yang sama: sembunyikan nama yang sudah dipilih di kolom satunya.
      const lain = namaPasangan(key);
      const hasilSemua = cariSiswaDiKelas(kelas, search.value).filter(nama => !lain.includes(nama));
      const dipotong = kelas === "Tambahan" && hasilSemua.length > 40;
      const hasil = dipotong ? hasilSemua.slice(0, 40) : hasilSemua;
      box.classList.remove("hidden");
      box.innerHTML = hasil.length
        ? hasil.map((nama) => `<button type="button" role="option" class="block w-full border-b border-green-50 px-3 py-2 text-left hover:bg-green-50 focus:bg-green-50" data-pick-student="${esc(nama)}" data-picker="${key}">${esc(nama)}</button>`).join("") + (dipotong ? `<p class="p-3 text-sm text-green-800">Menampilkan 40 dari ${hasilSemua.length} nama. Ketik lebih banyak huruf untuk mempersempit.</p>` : "")
        : `<p class="p-3 text-green-800">Nama tidak ditemukan${kelas === "Tambahan" ? " di seluruh kelas" : " di kelas " + esc(kelas)}.</p>`;
    }

    function pilihSiswa(key, nama) {
      const search = pickerEl(key, "search");
      const hidden = pickerEl(key, "hidden");
      const selected = pickerEl(key, "selected");
      const box = pickerEl(key, "results");
      if (!search || !hidden) return;
      hidden.value = nama;
      search.value = nama;
      if (selected) {
        selected.textContent = "Terpilih: " + nama + " (" + (pickerEl(key, "kelas")?.value || "") + ")";
        selected.classList.remove("hidden");
      }
      if (box) { box.classList.add("hidden"); box.innerHTML = ""; }
    }

    function resetPicker(key) {
      const search = pickerEl(key, "search");
      const hidden = pickerEl(key, "hidden");
      const selected = pickerEl(key, "selected");
      const box = pickerEl(key, "results");
      const kelas = pickerEl(key, "kelas")?.value || "";
      if (hidden) hidden.value = "";
      if (selected) { selected.textContent = ""; selected.classList.add("hidden"); }
      if (box) { box.innerHTML = ""; box.classList.add("hidden"); }
      if (search) {
        search.value = "";
        search.disabled = !kelas;
        search.placeholder = kelas ? "Ketik nama anak di kelas " + kelas : "Pilih kelas dulu";
      }
    }

    // Nama petugas Kebersihan Kelas: setelah simpan tetap terisi, baru dikosongkan bila TANGGAL berbeda.
    // (Isian lain di form tetap dikosongkan setiap selesai simpan.)
    function terapkanJumlahPetugas() {
      const jumlah = Number(document.getElementById("k-officer-count")?.value || 1);
      KB_PETUGAS_KEYS.forEach((key, i) => {
        const row = document.getElementById("k-petugas-row-" + (i + 1));
        if (!row) return;
        const tampil = i < jumlah;
        row.classList.toggle("hidden", !tampil);
        if (!tampil) { const sel = pickerEl(key, "kelas"); if (sel) sel.value = ""; resetPicker(key); }
      });
    }

    function kosongkanPetugasKebersihan() {
      const cnt = document.getElementById("k-officer-count");
      if (cnt) cnt.value = "1";
      KB_PETUGAS_KEYS.forEach(key => { const sel = pickerEl(key, "kelas"); if (sel) sel.value = ""; resetPicker(key); });
      terapkanJumlahPetugas();
    }

    function restorePetugasKeep() {
      const keep = state.petugasKeep;
      const cnt = document.getElementById("k-officer-count");
      if (!keep || !cnt || !Array.isArray(keep.rows)) return;
      if (keep.tanggal !== localDateValue()) { state.petugasKeep = null; return; }
      cnt.value = String(keep.rows.length);
      terapkanJumlahPetugas();
      keep.rows.forEach((r, i) => {
        const key = KB_PETUGAS_KEYS[i];
        const sel = pickerEl(key, "kelas");
        if (sel) sel.value = r.kelas;
        resetPicker(key);
        if (r.nama) pilihSiswa(key, r.nama);
      });
    }

    document.addEventListener("change", (event) => {
      if (event.target.id === "k-officer-count") terapkanJumlahPetugas();
    });

    document.addEventListener("change", (event) => {
      const id = event.target.id;
      const keys = pickerKeysById(id, "kelas");
      if (keys.length) {
        keys.forEach(resetPicker);
        if (event.target.value) {
          renderHasilCariSiswa(keys[0]);
          pickerEl(keys[0], "search")?.focus();
        }
        return;
      }
      if (id === "k-date") {
        const keep = state.petugasKeep;
        if (keep && event.target.value && event.target.value !== keep.tanggal) {
          state.petugasKeep = null;
          kosongkanPetugasKebersihan();
        }
      }
    });

    document.addEventListener("input", (event) => {
      const keys = pickerKeysById(event.target.id, "search");
      if (!keys.length) return;
      const key = keys[0];
      // Mengetik ulang membatalkan pilihan sebelumnya.
      const hidden = pickerEl(key, "hidden");
      const selected = pickerEl(key, "selected");
      if (hidden) hidden.value = "";
      if (selected) { selected.textContent = ""; selected.classList.add("hidden"); }
      renderHasilCariSiswa(key);
    });

    document.addEventListener("focusin", (event) => {
      const keys = pickerKeysById(event.target.id, "search");
      if (keys.length && !pickerEl(keys[0], "hidden")?.value) renderHasilCariSiswa(keys[0]);
    });

    document.addEventListener("keydown", (event) => {
      const keys = pickerKeysById(event.target.id, "search");
      if (!keys.length || event.key !== "Enter") return;
      event.preventDefault();
      const key = keys[0];
      const kelas = pickerEl(key, "kelas")?.value || "";
      const lain = namaPasangan(key);
      const hasil = cariSiswaDiKelas(kelas, event.target.value).filter(nama => !lain.includes(nama));
      if (hasil.length && normalisasiNama(event.target.value)) pilihSiswa(key, hasil[0]);
    });

    document.addEventListener("click", (event) => {
      const pick = event.target.closest("[data-pick-student]");
      if (pick) pilihSiswa(pick.dataset.picker || "tumbler", pick.dataset.pickStudent);
    });

    // Kolom tanggal pada form tambah selalu terisi tanggal hari ini (tetap bisa diubah manual).
    function isiTanggalHariIni() {
      const hariIni = localDateValue();
      ["s-date", "v-date", "k-date", "g-date", "pj-date"].forEach(id => { const el = document.getElementById(id); if (el) el.value = hariIni; });
    }

    document.addEventListener("reset", (event) => {
      if (["sampahForm", "violationForm", "cleanForm", "ghForm"].includes(event.target.id)) setTimeout(isiTanggalHariIni, 0);
      if (event.target.id === "ghForm") setTimeout(() => { GH_PETUGAS_KEYS.forEach(resetPicker); terapkanJumlahGh(); resetHidroFoto(); }, 0);
      if (event.target.id === "violationForm") setTimeout(() => resetPicker("tumbler"), 0);
      if (event.target.id === "cleanForm") setTimeout(() => { KB_PETUGAS_KEYS.forEach(resetPicker); restorePetugasKeep(); terapkanJumlahPetugas(); }, 0);
    });

    async function saveViolationForm() {
      const form = document.getElementById("violationForm");
      if (!form) return;
      const button = document.getElementById("saveViolationBtn");
      clearOperationMessage();
      setSaveBusy(button);
      try {
        const data = Object.fromEntries(new FormData(form));
        lengkapi([
          { label: "Tanggal Pelanggaran", ok: !!data.tanggal, id: "v-date" },
          { label: "Kelas", ok: !!data.kelas, id: "v-class" },
          { label: "Nama Lengkap (cari lalu pilih dari daftar)", ok: !!data.nama, id: "v-search" }
        ]);
        if (!data.kelas) throw new Error("Pilih kelas terlebih dahulu.");
        if (!data.nama || !(SISWA_PER_KELAS[data.kelas] || []).includes(data.nama)) {
          throw new Error("Cari dan pilih nama anak dari daftar kelas " + data.kelas + ".");
        }

        await simpanPenjagaJikaAda();   // penjaga (presensi hari ini) ikut tercatat, 1 nama hanya 1x per hari

        await apiPost("addPelanggaran", {
          tanggal: data.tanggal,
          kelas: data.kelas,
          nama: data.nama
        });

        form.reset();
        showOperationMessage("Berhasil disimpan", "success", "operationMessage", form);
        toast("Pelanggaran disimpan.");
      } catch (error) {
        showOperationMessage(error.message || "Gagal menyimpan data.", "error", "operationMessage", form);
        toast(error.message || "Gagal menyimpan data.", "error");
      } finally {
        restoreSaveButton(button);
      }
    }

    async function saveCleanForm() {
      const form = document.getElementById("cleanForm");
      if (!form) return;
      const button = document.getElementById("saveCleanBtn");
      clearOperationMessage();
      setSaveBusy(button);
      try {
        const fd = Object.fromEntries(new FormData(form));
        const jumlahPetugas = Number(document.getElementById("k-officer-count")?.value || 1);
        const baris = KB_PETUGAS_KEYS.slice(0, jumlahPetugas).map((key, i) => ({
          no: i + 1, key,
          kelas: pickerEl(key, "kelas")?.value || "",
          nama: pickerEl(key, "hidden")?.value || ""
        }));
        const daftarPetugas = [{ label: "Tanggal", ok: !!fd.tanggal, id: "k-date" }];
        baris.forEach(b => {
          daftarPetugas.push({ label: "Kelas Petugas " + b.no, ok: !!b.kelas, id: PICKERS[b.key].kelas });
          daftarPetugas.push({ label: "Nama Petugas " + b.no + " (cari lalu pilih dari daftar)", ok: !!b.nama, id: PICKERS[b.key].search });
        });
        lengkapi(daftarPetugas.concat([
          { label: "Kelas", ok: !!fd.kelas, id: "k-class" },
          { label: "Status Kebersihan", ok: !!fd.bersih },
          { label: "Status Kipas", ok: !!fd.kipasMati },
          { label: "Bukti Foto", ok: !!state.photoBase64, id: "k-photo" },
          { label: "Bukti Foto Kipas Menyala", ok: fd.kipasMati !== "false" || !!state.photoKipasBase64, id: "k-photo-kipas" }
        ]));
        baris.forEach(b => {
          if (!(SISWA_PER_KELAS[b.kelas] || []).includes(b.nama)) throw new Error("Nama Petugas " + b.no + " harus dipilih dari daftar kelas " + b.kelas + ".");
        });
        const namaPetugas = baris.map(b => b.nama);
        if (new Set(namaPetugas).size !== namaPetugas.length) throw new Error("Nama petugas tidak boleh sama. Periksa kembali daftar petugas.");

        if (!state.photoBase64) throw new Error("Mohon pilih foto kebersihan.");

        const data = Object.fromEntries(new FormData(form));
        const kipasMenyala = data.kipasMati === "false";
        if (kipasMenyala && !state.photoKipasBase64) throw new Error("Mohon ambil bukti foto kipas menyala.");

        await apiPost("addKebersihan", {
          tanggal: data.tanggal,
          petugas: namaPetugas.join(" & "),
          petugasList: namaPetugas,
          kelasPetugas: baris[0].kelas,
          jumlahPetugas,
          kelas: data.kelas,
          bersih: data.bersih === "true",
          kipasMati: data.kipasMati === "true",
          fotoBase64: state.photoBase64,
          namaFile: state.photoName,
          fotoKipasBase64: kipasMenyala ? state.photoKipasBase64 : "",
          namaFileKipas: kipasMenyala ? state.photoKipasName : ""
        });

        state.photoBase64 = "";
        state.photoName = "";
        state.photoKipasBase64 = "";
        state.photoKipasName = "";
        state.petugasKeep = { tanggal: data.tanggal, rows: baris.map(b => ({ kelas: b.kelas, nama: b.nama })) };
        state.cekLokal = state.cekLokal || {};
        (state.cekLokal[data.tanggal] = state.cekLokal[data.tanggal] || []).push(data.kelas);
        showOperationMessage("Berhasil disimpan", "success", "operationMessage", form);
        toast("Data kebersihan disimpan.");
        reloadActiveData(); // tanpa await: tombol tidak menunggu rekap dimuat ulang
        form.reset();
        document.getElementById("photoPreview")?.classList.add("hidden");
        document.getElementById("photoKipasPreview")?.classList.add("hidden");
        document.getElementById("k-photo-kipas-wrap")?.classList.add("hidden");
        const label = document.getElementById("k-photo-label");
        if (label) label.textContent = "Bukti Foto";
      } catch (error) {
        showOperationMessage(error.message || "Gagal menyimpan data.", "error", "operationMessage", form);
        toast(error.message || "Gagal menyimpan data.", "error");
      } finally {
        restoreSaveButton(button);
      }
    }

    function qrBanner(kind, title, sub) {
      const el = document.getElementById("qrFsBanner");
      if (!el) return;
      const warna = { ok: "#15803d", info: "#1d4ed8", warn: "#b45309", err: "#b91c1c" };
      el.style.background = warna[kind] || warna.info;
      el.innerHTML = `<div class="qr-fs-title">${esc(title)}</div>${sub ? `<div class="qr-fs-sub">${esc(sub)}</div>` : ""}`;
      el.classList.add("show");
    }
    function qrBannerHide() { document.getElementById("qrFsBanner")?.classList.remove("show"); }

    // Dipanggil setiap QR terbaca: langsung tampil "berhasil terbaca", lalu
    // simpan otomatis. Kamera tetap menyala supaya scan berikutnya cepat.
    async function handleQrDecoded(decodedText) {
      if (qrTumblerProcessing) return;
      const now = Date.now();
      const parsed = parseQrTumbler(decodedText);
      if (!parsed) {
        if (now - qrLastCodeTime > 2500) {
          qrLastCodeTime = now;
          qrBanner("err", "QR tidak dikenali", "Gunakan QR kartu pelajar");
          setTimeout(qrBannerHide, 1500);
        }
        return;
      }
      const nama = parsed.nama;
      const kelas = canonicalQrClass(parsed.kelas);
      const kode = nama.toLowerCase() + "|" + kelas;
      if (kode === qrLastCode && now - qrLastCodeTime < 4000) return;
      qrLastCode = kode;
      qrLastCodeTime = now;
      qrTumblerProcessing = true;
      playQrNotice();
      try { navigator.vibrate?.(80); } catch {}
      qrBanner("info", `${nama}, ${kelas}`, "Berhasil terbaca \u2022 menyimpan\u2026");
      try {
        const response = await apiPost("addPelanggaranViaQr", { tanggal: localDateValue(), kelas, nama });
        const hasil = response?.data || {};
        if (response?.queued) qrBanner("warn", `${nama}, ${kelas}`, "Offline \u2022 tersimpan, dikirim saat online");
        else if (hasil.sudahTerdaftar) qrBanner("warn", `${nama}, ${kelas}`, "Sudah terdaftar ke pelanggaran");
        else qrBanner("ok", `${nama}, ${kelas}`, "Berhasil disimpan \u2713");
      } catch (e) {
        qrBanner("err", `${nama}, ${kelas}`, e.message || "Gagal menyimpan, coba scan lagi");
        qrLastCode = "";
      }
      qrLastCodeTime = Date.now();
      setTimeout(() => { qrBannerHide(); qrTumblerProcessing = false; }, 1400);
    }

    async function startFullscreenQrScan() {
      if (violationQrScanner || violationQrScannerStarting || violationQrScannerStopping) return;
      const result = document.getElementById("qrScanResult");
      if (result) result.textContent = "";
      if (typeof Html5Qrcode === "undefined") {
        if (result) result.textContent = "Pustaka pemindai QR belum tersedia.";
        return;
      }
      if (window.isSecureContext === false) {
        const pesanHttps = "Fitur scan QR membutuhkan koneksi HTTPS. Pastikan alamat website diawali https://";
        if (result) result.textContent = pesanHttps;
        toast(pesanHttps, "error");
        return;
      }
      ensureQrAudioContext();
      violationQrScannerStarting = true;
      qrTumblerProcessing = false;
      qrLastCode = "";
      document.getElementById("qrFullscreen")?.remove();
      const overlay = document.createElement("div");
      overlay.id = "qrFullscreen";
      overlay.innerHTML = `<div id="qrFsReader"></div><button id="qrFsClose" type="button" aria-label="Tutup kamera">\u2715</button><div id="qrFsBanner" role="status" aria-live="polite"></div>`;
      document.body.appendChild(overlay);
      overlay.querySelector("#qrFsClose").addEventListener("click", () => resetQrTumblerState(true));

      const scanner = new Html5Qrcode("qrFsReader", {
        formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
      violationQrScanner = scanner;
      try {
        await scanner.start(
          { facingMode: "environment" },
          {
            fps: 15,
            aspectRatio: Math.max(window.innerHeight, window.innerWidth) / Math.min(window.innerHeight, window.innerWidth),
            qrbox: (w, h) => { const sisi = Math.floor(Math.min(w, h) * 0.7); return { width: sisi, height: sisi }; }
          },
          handleQrDecoded,
          () => {}
        );
        violationQrScannerStarting = false;
      } catch (err) {
        violationQrScannerStarting = false;
        violationQrScanner = null;
        overlay.remove();
        const namaError = err?.name || "";
        let pesan = "Kamera gagal diaktifkan (" + namaError + "): " + (err?.message || err);
        if (namaError === "NotAllowedError" || namaError === "PermissionDeniedError") {
          pesan = "Izin kamera ditolak. Periksa izin situs (ikon gembok di address bar > Izin > Kamera > Izinkan) dan izin aplikasi browser di Setelan HP, lalu coba lagi.";
        } else if (namaError === "NotFoundError" || namaError === "DevicesNotFoundError") {
          pesan = "Kamera tidak ditemukan di perangkat ini.";
        } else if (namaError === "NotReadableError" || namaError === "TrackStartError") {
          pesan = "Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera/video call lain, lalu coba lagi.";
        }
        if (result) result.textContent = pesan;
        toast(pesan, "error");
      }
    }

    async function saveQrTumbler() {
      const pending = qrTumblerPending;
      if (!pending) return;

    // ---------- Notifikasi "perlu hukuman" (khusus perangkat dengan akses Rekap) ----------
    // CATATAN JUJUR: ini BUKAN push notification server-ke-HP sungguhan (itu
    // butuh infrastruktur tambahan di luar Apps Script, mis. Firebase Cloud
    // Messaging). Ini adalah notifikasi LOKAL browser: berfungsi selama
    // aplikasi/tab masih terbuka di background (dicek berkala), TIDAK akan
    // muncul kalau aplikasi/browser sudah ditutup total. Hanya aktif di
    // perangkat yang PIN Rekap-nya sudah pernah diverifikasi (tersimpan di
    // localStorage perangkat itu saja, bukan global ke semua orang).
    const HUKUMAN_NOTIF_KEY = "adiwiyata_notified_hukuman";
    const HUKUMAN_CHECK_INTERVAL_MS = 5 * 60 * 1000; // 5 menit
    let hukumanNotifTimer = null;

    async function checkHukumanNotifications() {
      if (!state.rekapAuthenticated) return;
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      try {
        const data = await apiGet("getRekapPelanggaran");
        const statusAnak = data?.statusAnak || [];
        let notified = [];
        try { notified = JSON.parse(localStorage.getItem(HUKUMAN_NOTIF_KEY) || "[]"); } catch {}
        const notifiedSet = new Set(notified);
        const stillPending = new Set();

        statusAnak.forEach(s => {
          const perluNotif = s.perluHukuman && s.statusHukuman === "belum menjalankan hukuman";
          if (!perluNotif) return;
          const key = (String(s.nama) + "_" + String(s.kelas)).trim().toUpperCase();
          stillPending.add(key);
          if (!notifiedSet.has(key)) {
            try {
              new Notification("Perlu Tindakan Hukuman", {
                body: `${s.nama}, ${s.kelas} sudah waktunya mendapat hukuman (${s.totalPelanggaran}x tidak bawa tumbler).`,
                tag: key
              });
            } catch {}
          }
        });

        localStorage.setItem(HUKUMAN_NOTIF_KEY, JSON.stringify([...stillPending]));
      } catch {}
    }

    function startHukumanNotifWatcher() {
      if (!state.rekapAuthenticated) return;
      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission().then(() => checkHukumanNotifications());
      } else {
        checkHukumanNotifications();
      }
      if (hukumanNotifTimer) clearInterval(hukumanNotifTimer);
      hukumanNotifTimer = setInterval(checkHukumanNotifications, HUKUMAN_CHECK_INTERVAL_MS);
    }

    // =====================================================================
    // LAPORAN PDF (Rekap Absensi, Sampah Botol, Pelanggaran Tumbler, Kebersihan Kelas)
    // Memakai jsPDF + AutoTable (dimuat saat pertama kali dibutuhkan, lalu disimpan oleh CdnCache APK).
    // =====================================================================
    const PDF_LIBS = [
      "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
      "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"
    ];
    const PDF_HIJAU = [23, 107, 58];
    const PDF_HIJAU_MUDA = [243, 249, 238];

    function pdfMuatScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        s.onload = () => resolve();
        s.onerror = () => { s.remove(); reject(new Error("Pustaka PDF gagal dimuat. Pastikan internet aktif saat pertama kali membuat PDF.")); };
        document.head.appendChild(s);
      });
    }

    async function pdfSiapkan() {
      if (!window.jspdf) await pdfMuatScript(PDF_LIBS[0]);
      if (!window.jspdf.jsPDF.API.autoTable) await pdfMuatScript(PDF_LIBS[1]);
    }

    function pdfIso(v) {
      if (v == null || v === "") return "";
      const s = String(v);
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
      const d = new Date(s);
      return Number.isNaN(d.getTime()) ? "" : absIso(d);
    }
    function pdfTgl(v) { const i = pdfIso(v); return i ? absTgl(i) : (v ? String(v) : "-"); }
    function pdfAngka(n) { return (Number(n) || 0).toLocaleString("id-ID", { maximumFractionDigits: 3 }); }
    function pdfPeriode(dari, sampai) {
      if (dari && sampai) return "Periode: " + absTgl(dari) + " s/d " + absTgl(sampai);
      if (dari) return "Periode: sejak " + absTgl(dari);
      if (sampai) return "Periode: sampai " + absTgl(sampai);
      return "Periode: semua data";
    }
    function pdfDalam(v, dari, sampai) {
      const i = pdfIso(v);
      if (!dari && !sampai) return true;
      if (!i) return false;
      return (!dari || i >= dari) && (!sampai || i <= sampai);
    }
    function pdfUrutTgl(a, b) { return pdfIso(a.tanggal) < pdfIso(b.tanggal) ? -1 : pdfIso(a.tanggal) > pdfIso(b.tanggal) ? 1 : 0; }

    function pdfBaru(judul, sub, landscape) {
      const doc = new window.jspdf.jsPDF({ orientation: landscape ? "landscape" : "portrait", unit: "mm", format: "a4" });
      const W = doc.internal.pageSize.getWidth();
      doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(...PDF_HIJAU);
      doc.text("PROGRAM ADIWIYATA SPENDASI", 12, 14);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(70, 90, 75);
      doc.text("SMP Negeri 2 Sidoarjo  |  Aplikasi ARUNIKA", 12, 19);
      doc.setDrawColor(...PDF_HIJAU); doc.setLineWidth(0.8); doc.line(12, 22, W - 12, 22);
      doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(20, 40, 28);
      doc.text(judul, 12, 31);
      doc.setFont("helvetica", "normal"); doc.setFontSize(9.5); doc.setTextColor(60, 80, 65);
      const baris = [].concat(sub || []);
      baris.forEach((t, i) => doc.text(t, 12, 37 + i * 5));
      return { doc, y: 37 + baris.length * 5 + 3 };
    }

    function pdfBagian(ctx, teks) {
      const H = ctx.doc.internal.pageSize.getHeight();
      if (ctx.y > H - 45) { ctx.doc.addPage(); ctx.y = 18; }
      ctx.doc.setFont("helvetica", "bold"); ctx.doc.setFontSize(11); ctx.doc.setTextColor(...PDF_HIJAU);
      ctx.doc.text(teks, 12, ctx.y);
      ctx.y += 3;
    }

    function pdfTeks(ctx, teks, tebal) {
      const H = ctx.doc.internal.pageSize.getHeight();
      if (ctx.y > H - 25) { ctx.doc.addPage(); ctx.y = 18; }
      ctx.doc.setFont("helvetica", tebal ? "bold" : "normal"); ctx.doc.setFontSize(9.5); ctx.doc.setTextColor(30, 50, 35);
      const w = ctx.doc.internal.pageSize.getWidth() - 24;
      const lines = ctx.doc.splitTextToSize(teks, w);
      ctx.doc.text(lines, 12, ctx.y + 3);
      ctx.y += lines.length * 4.6 + 3;
    }

    function pdfTabel(ctx, head, body, opts) {
      ctx.doc.autoTable(Object.assign({
        startY: ctx.y, head: [head], body, theme: "grid",
        styles: { fontSize: 8.5, cellPadding: 1.8, lineColor: [196, 212, 198], lineWidth: 0.15, overflow: "linebreak", textColor: [30, 50, 35], valign: "middle" },
        headStyles: { fillColor: PDF_HIJAU, textColor: 255, halign: "center", fontStyle: "bold" },
        footStyles: { fillColor: [226, 240, 218], textColor: [20, 60, 30], fontStyle: "bold" },
        alternateRowStyles: { fillColor: PDF_HIJAU_MUDA },
        margin: { left: 12, right: 12, top: 16, bottom: 16 }
      }, opts || {}));
      ctx.y = ctx.doc.lastAutoTable.finalY + 7;
    }

    function pdfSelesai(ctx, namaFile) {
      const doc = ctx.doc;
      const n = doc.internal.getNumberOfPages();
      const W = doc.internal.pageSize.getWidth();
      const H = doc.internal.pageSize.getHeight();
      const cetak = new Date().toLocaleString("id-ID", { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" });
      for (let i = 1; i <= n; i++) {
        doc.setPage(i);
        doc.setDrawColor(196, 212, 198); doc.setLineWidth(0.2); doc.line(12, H - 11, W - 12, H - 11);
        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(100, 120, 105);
        doc.text("Dicetak: " + cetak, 12, H - 6.5);
        doc.text("Halaman " + i + " dari " + n, W - 12, H - 6.5, { align: "right" });
      }
      return pdfSimpan(doc, namaFile);
    }

    function pdfSimpan(doc, namaFile) {
      const nama = namaFile.replace(/[^\w\-]+/g, "_") + "_" + absToday() + ".pdf";
      if (window.AndroidBridge) {
        if (typeof window.AndroidBridge.savePdf !== "function") throw new Error("Aplikasi perlu diperbarui (build APK terbaru) agar bisa menyimpan PDF.");
        const b64 = doc.output("datauristring").split(",")[1];
        if (!window.AndroidBridge.savePdf(b64, nama)) throw new Error("PDF gagal disimpan di perangkat.");
        toast("PDF tersimpan di folder Download/ARUNIKA.");
        return;
      }
      doc.save(nama);
      toast("PDF diunduh.");
    }

    // ---------- Rekap Absensi ----------
    function pdfAbsensiBlok(ctx, b) {
      if (b.judul) pdfBagian(ctx, b.judul);
      if (!b.pdf) { pdfTeks(ctx, b.pesan || ""); return; }
      const nSesi = b.pdf.nSesi;
      pdfTabel(ctx, b.pdf.head, b.pdf.body, {
        horizontalPageBreak: true, horizontalPageBreakRepeat: [0, 1, 2],
        styles: { fontSize: nSesi > 12 ? 7 : 8, cellPadding: 1.4, lineColor: [196, 212, 198], lineWidth: 0.15, overflow: "linebreak", textColor: [30, 50, 35], valign: "middle" },
        columnStyles: { 0: { halign: "center", cellWidth: 9 }, 2: { halign: "center", cellWidth: 14 } },
        didParseCell: (d) => {
          if (d.section !== "body") return;
          const c = d.column.index;
          if (c >= 3 && c < 3 + nSesi) {
            d.cell.styles.halign = "center";
            const v = d.cell.raw;
            d.cell.styles.fontStyle = "bold";
            d.cell.styles.textColor = v === "A" ? [190, 30, 30] : v === "H" ? [23, 107, 58] : v === "S" ? [180, 110, 0] : v === "I" ? [3, 105, 161] : [160, 175, 163];
          } else if (c >= 3 + nSesi + 1) d.cell.styles.halign = "center";
        }
      });
    }

    async function pdfAbsensiRekap() {
      const a = absState();
      await pdfSiapkan();
      if (a.rekapTab === "hukuman") {
        const h = a.hukumanData;
        if (!h) throw new Error("Data hukuman belum dimuat.");
        const ctx = pdfBaru("Laporan Hukuman Absensi", ["Hukuman karena alpha " + (h.batas || 3) + " kali berturut-turut pada kegiatan yang sama."], false);
        pdfBagian(ctx, "Perlu Menjalankan Hukuman");
        const menunggu = h.menunggu || [];
        if (menunggu.length) pdfTabel(ctx, ["No", "Nama", "Kelas", "Kegiatan", "Alpha Berturut-turut", "Status"],
          menunggu.map((m, i) => [i + 1, absNama(m.nama), m.kelas, m.kegiatanNama + " (" + (ABS_MODE_LABEL[m.mode] || m.mode) + ")", m.jumlah + "x (" + (m.tanggal || []).map(absTglPendek).join(", ") + ")", "Belum menjalankan hukuman"]),
          { columnStyles: { 0: { halign: "center", cellWidth: 9 }, 2: { halign: "center", cellWidth: 14 } } });
        else pdfTeks(ctx, "Tidak ada anak yang perlu menjalankan hukuman.");
        pdfBagian(ctx, "Riwayat Hukuman");
        const riwayat = h.riwayat || [];
        if (riwayat.length) pdfTabel(ctx, ["No", "Nama", "Kelas", "Jumlah Hukuman", "Terakhir Dijalankan", "Rincian"],
          riwayat.map((r, i) => [i + 1, absNama(r.nama), r.kelas, r.jumlah + "x", r.terakhir || "-", (r.detail || []).map(d => d.kegiatanNama + " (alpha s/d " + absTglPendek(d.sampai) + ")").join("; ") || "-"]),
          { columnStyles: { 0: { halign: "center", cellWidth: 9 }, 2: { halign: "center", cellWidth: 14 }, 3: { halign: "center" } } });
        else pdfTeks(ctx, "Belum ada riwayat hukuman.");
        return pdfSelesai(ctx, "Laporan-Hukuman-Absensi");
      }
      const blok = (a.rekapBlok || []).filter(b => b.pdf || b.judul);
      if (!blok.some(b => b.pdf)) throw new Error("Belum ada data absensi pada rentang tanggal ini.");
      const jadwal = a.rekapTab === "jadwal";
      const sub = [pdfPeriode(a.rekapDari, a.rekapSampai).replace("Periode: ", "Periode: ")];
      if (jadwal && a.rekapKgtId) sub.push("Kegiatan: " + absKgtNama(a.rekapKgtId));
      const ctx = pdfBaru(jadwal ? "Laporan Rekap Absensi Jadwal" : "Laporan Rekap Absensi Seluruh Anggota", sub, true);
      blok.forEach(b => pdfAbsensiBlok(ctx, b));
      pdfTeks(ctx, "Keterangan: H = Hadir, S = Sakit, I = Izin, A = Alpha, - = belum ada catatan.");
      return pdfSelesai(ctx, jadwal ? "Laporan-Absensi-Jadwal" : "Laporan-Absensi-Seluruh-Anggota");
    }

    // ---------- Rekap Sampah Botol / Pelanggaran Tumbler / Kebersihan Kelas ----------
    function pdfRentang() {
      return { dari: document.getElementById("pdfDari")?.value || "", sampai: document.getElementById("pdfSampai")?.value || "" };
    }
    function pdfValid(r) { if (r.dari && r.sampai && r.dari > r.sampai) throw new Error("Rentang tanggal tidak valid."); }

    async function pdfSampah() {
      const r = pdfRentang(); pdfValid(r);
      const kelasFilter = document.getElementById("recapSampahFilter")?.value || "";
      const list = (Array.isArray(state.data.sampah?.list) ? state.data.sampah.list : [])
        .filter(x => x && (!kelasFilter || x.kelas === kelasFilter) && pdfDalam(x.tanggal, r.dari, r.sampai));
      if (!list.length) throw new Error("Tidak ada data sampah botol pada pilihan ini.");
      await pdfSiapkan();
      const total = list.reduce((s, x) => s + (Number(x.berat) || 0), 0);
      const sub = [pdfPeriode(r.dari, r.sampai) + "   |   Kelas: " + (kelasFilter || "Semua kelas")];
      const ctx = pdfBaru("Laporan Rekap Sampah Botol", sub, false);
      pdfTeks(ctx, "Total keseluruhan: " + pdfAngka(total) + " kg dari " + list.length + " kali setoran.", true);
      const per = {};
      list.forEach(x => { const k = x.kelas || "-"; (per[k] = per[k] || { n: 0, kg: 0 }); per[k].n++; per[k].kg += Number(x.berat) || 0; });
      const urut = Object.entries(per).sort((p, q) => q[1].kg - p[1].kg);
      pdfBagian(ctx, "Total per Kelas");
      pdfTabel(ctx, ["Peringkat", "Kelas", "Jumlah Setoran", "Total Berat (kg)"],
        urut.map(([k, v], i) => [i + 1, k, v.n + "x", pdfAngka(v.kg)]),
        { foot: [["", "Total", list.length + "x", pdfAngka(total)]], showFoot: "lastPage",
          columnStyles: { 0: { halign: "center" }, 1: { halign: "center" }, 2: { halign: "center" }, 3: { halign: "right" } } });
      pdfBagian(ctx, "Rincian Setoran");
      pdfTabel(ctx, ["No", "Tanggal", "Kelas", "Berat (kg)"],
        list.slice().reverse().map((x, i) => [i + 1, pdfTgl(x.tanggal), x.kelas || "-", pdfAngka(x.berat)]),
        { columnStyles: { 0: { halign: "center", cellWidth: 12 }, 2: { halign: "center" }, 3: { halign: "right" } } });
      return pdfSelesai(ctx, "Laporan-Sampah-Botol");
    }

    async function pdfTumbler() {
      const r = pdfRentang(); pdfValid(r);
      const v = state.data.violations || {};
      const daftar = (Array.isArray(v.daftar) ? v.daftar : []).filter(x => x && pdfDalam(x.tanggal, r.dari, r.sampai));
      const status = Array.isArray(v.statusAnak) ? v.statusAnak : [];
      if (!daftar.length && !status.length) throw new Error("Belum ada data pelanggaran tumbler.");
      await pdfSiapkan();
      const perlu = status.filter(s => s.perluHukuman === true && s.statusHukuman === "belum menjalankan hukuman").length;
      const ctx = pdfBaru("Laporan Rekap Pelanggaran Tumbler", [pdfPeriode(r.dari, r.sampai)], false);
      pdfTeks(ctx, "Pelanggaran pada periode: " + daftar.length + " kali.  Anak yang belum menjalankan hukuman: " + perlu + " anak.", true);
      pdfBagian(ctx, "Status Hukuman per Anak (akumulasi seluruh waktu)");
      const st = status.slice().sort((p, q) => ((q.perluHukuman === true) - (p.perluHukuman === true)) || ((Number(q.totalPelanggaran) || 0) - (Number(p.totalPelanggaran) || 0)));
      if (st.length) pdfTabel(ctx, ["No", "Nama", "Kelas", "Jumlah Pelanggaran", "Status Hukuman"],
        st.map((s, i) => [i + 1, s.nama || "", s.kelas || "", s.totalPelanggaran || 0, s.statusHukuman || "-"]),
        { columnStyles: { 0: { halign: "center", cellWidth: 12 }, 2: { halign: "center", cellWidth: 16 }, 3: { halign: "center" } },
          didParseCell: (d) => { if (d.section === "body" && d.column.index === 4) d.cell.styles.textColor = d.cell.raw === "sudah menjalankan hukuman" ? [23, 107, 58] : (d.cell.raw === "belum menjalankan hukuman" ? [180, 110, 0] : [30, 50, 35]); } });
      else pdfTeks(ctx, "Belum ada status pelanggaran anak.");
      pdfBagian(ctx, "Riwayat Pelanggaran");
      if (daftar.length) pdfTabel(ctx, ["No", "Tanggal", "Kelas", "Nama"],
        daftar.slice().reverse().map((x, i) => [i + 1, pdfTgl(x.tanggal), x.kelas || "", x.nama || ""]),
        { columnStyles: { 0: { halign: "center", cellWidth: 12 }, 2: { halign: "center", cellWidth: 16 } } });
      else pdfTeks(ctx, "Tidak ada pelanggaran pada periode ini.");
      return pdfSelesai(ctx, "Laporan-Pelanggaran-Tumbler");
    }

    async function pdfKebersihan() {
      const r = pdfRentang(); pdfValid(r);
      const resp = state.data.kebersihan;
      const semua = Array.isArray(resp) ? resp : (Array.isArray(resp?.list) ? resp.list : []);
      const list = semua.filter(x => x && pdfDalam(x.tanggal, r.dari, r.sampai));
      if (!list.length) throw new Error("Tidak ada data kebersihan kelas pada pilihan ini.");
      await pdfSiapkan();
      const ctx = pdfBaru("Laporan Rekap Kebersihan Kelas", [pdfPeriode(r.dari, r.sampai)], false);
      pdfTeks(ctx, "Jumlah penilaian: " + list.length + " kali.", true);
      const per = {};
      list.forEach(x => {
        const k = x.kelas || "-";
        const o = (per[k] = per[k] || { n: 0, bersih: 0, kipas: 0, poin: 0 });
        o.n++; if (boolValue(x.bersih)) o.bersih++; if (boolValue(x.kipasMati)) o.kipas++; o.poin += Number(x.poin) || 0;
      });
      const urut = Object.entries(per).sort((p, q) => q[1].poin - p[1].poin);
      pdfBagian(ctx, "Ringkasan per Kelas");
      pdfTabel(ctx, ["Peringkat", "Kelas", "Jumlah Penilaian", "Bersih", "Tidak Bersih", "Kipas Mati", "Total Poin"],
        urut.map(([k, o], i) => [i + 1, k, o.n, o.bersih, o.n - o.bersih, o.kipas, pdfAngka(o.poin)]),
        { columnStyles: { 0: { halign: "center" }, 1: { halign: "center" }, 2: { halign: "center" }, 3: { halign: "center" }, 4: { halign: "center" }, 5: { halign: "center" }, 6: { halign: "right" } } });
      pdfBagian(ctx, "Rincian Penilaian");
      pdfTabel(ctx, ["No", "Tanggal", "Kelas", "Petugas", "Kebersihan", "Kipas", "Poin"],
        list.slice().reverse().map((x, i) => [i + 1, pdfTgl(x.tanggal), x.kelas || "", x.petugas || "-", boolValue(x.bersih) ? "Bersih" : "Tidak Bersih", boolValue(x.kipasMati) ? "Mati" : "Menyala", pdfAngka(x.poin)]),
        { columnStyles: { 0: { halign: "center", cellWidth: 11 }, 2: { halign: "center", cellWidth: 15 }, 4: { halign: "center" }, 5: { halign: "center" }, 6: { halign: "right", cellWidth: 14 } },
          didParseCell: (d) => {
            if (d.section !== "body") return;
            if (d.column.index === 4) d.cell.styles.textColor = d.cell.raw === "Bersih" ? [23, 107, 58] : [190, 30, 30];
            if (d.column.index === 5) d.cell.styles.textColor = d.cell.raw === "Mati" ? [180, 110, 0] : [3, 105, 161];
          } });
      return pdfSelesai(ctx, "Laporan-Kebersihan-Kelas");
    }

    document.addEventListener("click", async (event) => {
      const btn = event.target.closest("[data-pdf]");
      if (!btn || btn.dataset.busy === "1") return;
      const jenis = btn.dataset.pdf;
      const asal = btn.innerHTML;
      btn.dataset.busy = "1";
      btn.innerHTML = "Menyiapkan PDF\u2026";
      try {
        if (jenis === "absensi") await pdfAbsensiRekap();
        else if (jenis === "sampah") await pdfSampah();
        else if (jenis === "tumbler") await pdfTumbler();
        else if (jenis === "kebersihan") await pdfKebersihan();
        else if (jenis === "greenhouse") await pdfGreenhouse();
        else if (jenis === "penjaga") await pdfPenjaga();
      } catch (error) {
        toast(error.message || "Gagal membuat PDF.", "error");
      } finally {
        btn.dataset.busy = "";
        btn.innerHTML = asal;
        refreshIcons();
      }
    });

      GH_PETUGAS_KEYS.forEach((key, i) => {
        const row = document.getElementById("g-petugas-row-" + (i + 1));
        if (!row) return;
        const tampil = i < jumlah;
        row.classList.toggle("hidden", !tampil);
        if (!tampil) { const sel = pickerEl(key, "kelas"); if (sel) sel.value = ""; resetPicker(key); }

      { key: "gh", label: "Green House", url: "fotoTdsURL", view: "fotoTdsViewURL" },
      { key: "kko", label: "Depan KKO", url: "fotoKkoURL", view: "fotoKkoViewURL" },

    function renderGreenhouse() {
      const app = document.getElementById("app");
      state.hidro = {};

      app.innerHTML = adminShell("greenhouse", `
        ${pageTop("Hidroponik", "Catat petugas, tempat yang diperiksa, bukti foto TDS, dan foto perkembangan tanaman.", "sprout")}
        <div class="grid gap-6 xl:grid-cols-[360px_1fr]">
          <section class="card h-fit p-5">
            <h2 class="text-xl font-extrabold text-green-950">Tambah Hidroponik</h2>
            <form id="ghForm" class="mt-4 space-y-3">
              <div id="operationMessage" class="hidden" role="status" aria-live="polite"></div>
              <div>
                <label for="g-date">Tanggal</label>
                <input id="g-date" class="input mt-1" name="tanggal" type="date" value="${localDateValue()}" required>
              </div>
              <div>
                <label for="g-officer-count">Jumlah Petugas (anak yang bertugas)</label>
                <select id="g-officer-count" class="input mt-1">${[1, 2, 3, 4, 5, 6].map(n => `<option value="${n}">${n} anak</option>`).join("")}</select>
              </div>

    async function saveGreenhouseForm() {
      const form = document.getElementById("ghForm");
      if (!form) return;
      const button = document.getElementById("saveGhBtn");
      clearOperationMessage();
      setSaveBusy(button);
      try {
        const fd = Object.fromEntries(new FormData(form));
        const jumlahPetugas = Number(document.getElementById("g-officer-count")?.value || 1);
        const baris = GH_PETUGAS_KEYS.slice(0, jumlahPetugas).map((key, i) => ({
          no: i + 1, key,
          kelas: pickerEl(key, "kelas")?.value || "",
          nama: pickerEl(key, "hidden")?.value || ""
        }));
        const daftarPetugas = [{ label: "Tanggal", ok: !!fd.tanggal, id: "g-date" }];
        baris.forEach(b => {
          daftarPetugas.push({ label: "Kelas Petugas " + b.no, ok: !!b.kelas, id: PICKERS[b.key].kelas });
          daftarPetugas.push({ label: "Nama Petugas " + b.no + " (cari lalu pilih dari daftar)", ok: !!b.nama, id: PICKERS[b.key].search });
        });
        const tempatDipilih = HIDRO_TEMPAT.filter(t => document.getElementById("h-tempat-" + t.key)?.checked);
        const daftarTempat = [{ label: "Tempat yang Diperiksa (pilih minimal satu)", ok: tempatDipilih.length > 0, id: "h-tempat-gh" }];
        tempatDipilih.forEach(t => daftarTempat.push({ label: "Bukti Foto TDS " + t.label + " (tekan Ambil Foto)", ok: !!state.hidro?.[t.key]?.foto, id: "h-fotobtn-" + t.key }));
        const tanamanDipilih = !!document.getElementById("h-tanaman-cek")?.checked;
        const daftarTanaman = tanamanDipilih ? [{ label: "Foto Perkembangan Tanaman (tekan Ambil Foto, atau hilangkan centang bila tidak dipakai)", ok: !!state.hidro?.tanaman?.foto, id: "h-fotobtn-tanaman" }] : [];
        lengkapi(daftarPetugas.concat(daftarTempat, daftarTanaman));
        baris.forEach(b => {
          if (!(SISWA_PER_KELAS[b.kelas] || []).includes(b.nama)) throw new Error("Nama Petugas " + b.no + " harus dipilih dari daftar kelas " + b.kelas + ".");
        });
        const namaPetugas = baris.map(b => b.nama);
        if (new Set(namaPetugas).size !== namaPetugas.length) throw new Error("Nama petugas tidak boleh sama. Periksa kembali daftar petugas.");

        await apiPost("addGreenhouse", {
          tanggal: fd.tanggal,
          petugas: namaPetugas.join(" & "),
          petugasList: namaPetugas,
          kelasPetugas: [...new Set(baris.map(b => b.kelas))].join(", "),
          jumlahPetugas,
          tempat: tempatDipilih.map(t => t.label),
          fotoGhBase64: state.hidro?.gh?.foto || "",
          fotoKkoBase64: state.hidro?.kko?.foto || "",
          fotoLobbyBase64: state.hidro?.lobby?.foto || "",
          fotoTanamanBase64: tanamanDipilih ? (state.hidro?.tanaman?.foto || "") : ""
        });

        showOperationMessage("Berhasil disimpan", "success", "operationMessage", form);
        toast("Data Hidroponik disimpan.");
        reloadActiveData();
        form.reset();
        resetHidroFoto();
        refreshIcons();
      } catch (error) {
        showOperationMessage(error.message || "Gagal menyimpan data.", "error", "operationMessage", form);
        toast(error.message || "Gagal menyimpan data.", "error");
      } finally {
        restoreSaveButton(button);
      }
    }

    document.addEventListener("click", (event) => {

    document.addEventListener("change", async (event) => {
      const kotak = event.target.closest ? event.target.closest("[data-hidro-tempat]") : null;
      if (kotak) {
        document.getElementById("h-foto-" + kotak.dataset.hidroTempat)?.classList.toggle("hidden", !kotak.checked);

      if (event.target.id === "h-tanaman-cek") {

      const cocok = /^h-photo-(gh|kko|lobby|tanaman)$/.exec(event.target.id || "");

      const key = cocok[1];

        state.hidro[key] = { foto: data, nama: berkas.name };

    // Daftar kelas yang belum ada penilaian Kebersihan Kelas pada tanggal yang dipilih.
    function renderBelumDiperiksa() {
      const box = document.getElementById("belumDiperiksa");
      if (!box) return;
      // Tab Rekap: tanggal dari kolom tanggal. Halaman Kebersihan Kelas: tidak ada kolom, selalu hari ini.
      const tgl = document.getElementById("belumTanggal")?.value || localDateValue();
      const resp = state.route === "kebersihan" ? state.data.kebersihanHarian : state.data.kebersihan;
      if (resp === undefined || resp === null) { box.innerHTML = loading(); return; }
      if (resp && resp.error) { box.innerHTML = `<p class="text-red-700">Daftar kelas belum bisa dimuat: ${esc(resp.error)}</p>`; return; }
      const rows = Array.isArray(resp) ? resp : (Array.isArray(resp?.list) ? resp.list : []);
      const sudah = new Set(rows.filter(r => r && pdfIso(r.tanggal) === tgl).map(r => String(r.kelas || "").trim().toUpperCase()));
      // Data yang baru saja disimpan di perangkat ini (termasuk yang masih antri offline) ikut dihitung.
      ((state.cekLokal && state.cekLokal[tgl]) || []).forEach(k => sudah.add(String(k).trim().toUpperCase()));
      const belum = CLASSES.filter(k => !sudah.has(String(k).toUpperCase()));
      if (!belum.length) {
        box.innerHTML = `<p class="font-semibold text-green-800">Semua ${CLASSES.length} kelas sudah diperiksa pada ${esc(absTgl(tgl))}.</p>`;

      box.innerHTML = `
        <p class="font-semibold text-amber-950">${belum.length} dari ${CLASSES.length} kelas belum diperiksa pada ${esc(absTgl(tgl))}:</p>
        <div class="mt-2 flex flex-wrap gap-2">${belum.map(k => `<span class="badge bg-amber-100 text-amber-800">${esc(k)}</span>`).join("")}</div>
        <p class="mt-2 text-sm text-amber-900">Sudah diperiksa: ${CLASSES.length - belum.length} kelas.</p>`;
    }

      pdfBagian(ctx, "Ringkasan per Tempat yang Diperiksa");
      pdfTabel(ctx, ["No", "Tempat", "Jumlah Pemeriksaan"],

    // =====================================================================
    // HAPUS MASSAL DI REKAP: 1 tombol "Hapus" -> centang data -> konfirmasi
    // =====================================================================
    const HAPUS_JENIS = {
      sampah: { tabel: "recapSampahTable", label: "data sampah botol" },
      violation: { tabel: "recapViolationRawTable", label: "data riwayat pelanggaran" },
      clean: { tabel: "recapCleanTable", label: "data kebersihan kelas" },
      greenhouse: { tabel: "recapGreenhouseTable", label: "data Hidroponik" }
    };

    function hapusTerpilih(jenis) {
      return [...document.querySelectorAll("#" + HAPUS_JENIS[jenis].tabel + " [data-pilih-hapus]:checked")];
    }

    function renderHapusBar(jenis) {
      const bar = document.getElementById("hapusBar-" + jenis);
      if (!bar) return;
      if (state.hapusMode !== jenis) {
        bar.innerHTML = `<button class="btn btn-danger" type="button" data-hapus-mulai="${jenis}">${icon("trash-2")} Hapus</button>`;
      } else {
        const n = hapusTerpilih(jenis).length;
        bar.innerHTML = `<div class="flex flex-wrap items-center gap-2 rounded-xl border border-red-200 bg-red-50 p-3">
          <span class="font-semibold text-red-900">Centang data yang akan dihapus (${n} dipilih)</span>
          <button class="btn btn-soft" type="button" data-hapus-semua-btn="${jenis}">Pilih Semua</button>
          <button class="btn btn-danger" type="button" data-hapus-lanjut="${jenis}" ${n ? "" : "disabled"}>${icon("trash-2")} Hapus yang Dipilih (${n})</button>
          <button class="btn btn-soft" type="button" data-hapus-batal="${jenis}">Batal</button>
        </div>`;
      }
      refreshIcons();
    }

    function renderTabelRekapJenis(jenis) {
      if (jenis === "sampah") {
        renderSampahTable("recapSampahTable");
        limitRecapTable("recapSampahTable", "Rekap Sampah Botol");
      } else if (jenis === "violation") {
        renderViolationTables("recapViolationRawTable", "recapViolationStatusTable");
        limitRecapTable("recapViolationRawTable", "Riwayat Pelanggaran Mentah");
        limitRecapTable("recapViolationStatusTable", "Status per Anak");
      } else if (jenis === "clean") {
        renderCleanTableAt("recapCleanTable", state.data.kebersihan);
        limitRecapTable("recapCleanTable", "Rekap Kebersihan Kelas");
      } else if (jenis === "greenhouse") {
        renderGreenhouseTableAt("recapGreenhouseTable", state.data.greenhouse);
        limitRecapTable("recapGreenhouseTable", "Rekap Hidroponik");
      }
    }

    function mulaiHapus(jenis) {
      if (state.hapusMode && state.hapusMode !== jenis) keluarHapus(state.hapusMode);
      state.hapusMode = jenis;
      const wadah = document.getElementById(HAPUS_JENIS[jenis].tabel);
      if (!wadah) return;
      wadah.classList.add("mode-hapus");
      wadah.querySelectorAll("tbody tr.hidden").forEach(r => r.classList.remove("hidden"));   // tampilkan semua baris
      wadah.querySelectorAll("[data-full-table-title]").forEach(b => b.classList.add("hidden"));
      renderHapusBar(jenis);
    }

    function keluarHapus(jenis, renderUlang = true) {
      state.hapusMode = null;
      document.getElementById(HAPUS_JENIS[jenis].tabel)?.classList.remove("mode-hapus");
      if (renderUlang) renderTabelRekapJenis(jenis);
      renderHapusBar(jenis);
    }

    function tampilkanKonfirmasiHapusBanyak(jenis) {
      const kotak = hapusTerpilih(jenis);
      const ids = kotak.map(c => getRow(c.dataset.rowKey)?.id).filter(Boolean);
      if (!ids.length) { toast("Centang minimal satu data yang akan dihapus.", "error"); return; }
      state.hapusBanyak = { jenis, ids };
      setModal(`
        <div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="hapus-banyak-title">
          <div class="modal-box p-6">
            <h2 id="hapus-banyak-title" class="text-xl font-extrabold text-green-950">Hapus ${ids.length} Data</h2>
            <p class="mt-2 text-green-800">Anda akan menghapus <b>${ids.length}</b> ${esc(HAPUS_JENIS[jenis].label)} yang dicentang. Data yang dihapus tidak bisa dikembalikan.</p>
            <p id="hapusBanyakStatus" class="mt-2 text-sm text-green-800" aria-live="polite"></p>
            <div class="mt-6 flex justify-end gap-3">
              <button class="btn btn-soft" type="button" data-close-modal>Batal</button>
              <button class="btn btn-danger" type="button" id="konfirmasiHapusBanyak">${icon("trash-2")} Ya, Hapus</button>
            </div>
          </div>
        </div>`);
    }

    async function jalankanHapusBanyak() {
      const info = state.hapusBanyak;
      if (!info || !info.ids.length) return;
      const tombol = document.getElementById("konfirmasiHapusBanyak");
      const status = document.getElementById("hapusBanyakStatus");
      if (tombol) tombol.disabled = true;
      let terhapus = 0;
      try {
        for (let i = 0; i < info.ids.length; i += 10) {
          const bagian = info.ids.slice(i, i + 10);
          if (status) status.textContent = "Menghapus " + Math.min(i + 10, info.ids.length) + " dari " + info.ids.length + "...";
          const res = await apiPost("deleteBanyak", { jenis: info.jenis, ids: bagian });
          const n = Number(res?.data?.deleted);
          terhapus += Number.isFinite(n) ? n : bagian.length;
        }
      } catch (error) {
        if (status) status.textContent = error.message || "Gagal menghapus data.";
        if (tombol) tombol.disabled = false;
        toast(error.message || "Gagal menghapus data.", "error");
        return;
      }
      state.hapusBanyak = null;
      closeModal();
      toast(terhapus + " data berhasil dihapus.");
      await renderRecapData();
    }

    document.addEventListener("click", (event) => {
      const mulai = event.target.closest("[data-hapus-mulai]");
      if (mulai) { mulaiHapus(mulai.dataset.hapusMulai); return; }
      const batal = event.target.closest("[data-hapus-batal]");
      if (batal) { keluarHapus(batal.dataset.hapusBatal); return; }
      const semua = event.target.closest("[data-hapus-semua-btn]");
      if (semua) {
        const jenis = semua.dataset.hapusSemuaBtn;
        const kotak = [...document.querySelectorAll("#" + HAPUS_JENIS[jenis].tabel + " [data-pilih-hapus]")];
        const penuh = kotak.length > 0 && kotak.every(c => c.checked);
        kotak.forEach(c => { c.checked = !penuh; });
        renderHapusBar(jenis);
        return;
      }
      const lanjut = event.target.closest("[data-hapus-lanjut]");
      if (lanjut) { tampilkanKonfirmasiHapusBanyak(lanjut.dataset.hapusLanjut); return; }
      if (event.target.closest("#konfirmasiHapusBanyak")) { jalankanHapusBanyak(); return; }
      if (event.target.closest("[data-recap-tab]") && state.hapusMode) keluarHapus(state.hapusMode);
    });

    document.addEventListener("change", (event) => {
      if (!state.hapusMode) return;
      if (event.target.matches("[data-pilih-semua]")) {
        const wadah = event.target.closest("table");
        wadah?.querySelectorAll("[data-pilih-hapus]").forEach(c => { c.checked = event.target.checked; });
      }
      if (event.target.matches("[data-pilih-hapus], [data-pilih-semua]")) renderHapusBar(state.hapusMode);
    });

    // Edit Kebersihan Kelas: poin ikut terisi otomatis saat status diganti (tetap bisa diketik manual).
    document.addEventListener("change", (event) => {
      if (!event.target.closest("#editCleanForm")) return;
      if (event.target.name !== "bersih" && event.target.name !== "kipasMati") return;
      const form = document.getElementById("editCleanForm");
      const poin = (form.querySelector('input[name="bersih"]:checked')?.value === "true" ? 50 : 0)
        + (form.querySelector('input[name="kipasMati"]:checked')?.value === "true" ? 50 : 0);
      const kolom = document.getElementById("edit-k-points");
      if (kolom) kolom.value = String(poin);
    });

    // Edit Hidroponik
    function showEditGreenhouseModal(row) {
      setModal(`
        <div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="edit-title">
          <form id="editGreenhouseForm" class="modal-box p-6">
            <div id="modalOperationMessage" class="hidden" role="status" aria-live="polite"></div>
            <div class="flex items-center justify-between gap-4">
              <h2 id="edit-title" class="text-2xl font-extrabold text-green-950">Edit Hidroponik</h2>
              <button class="btn btn-soft" type="button" data-close-modal>${icon("x")} Tutup</button>
            </div>
            <input type="hidden" name="id" value="${esc(row.id)}">
            <div class="mt-5 space-y-3">
              <div>
                <label for="edit-g-date">Tanggal</label>
                <input id="edit-g-date" class="input mt-1" name="tanggal" type="date" value="${esc(inputDateValue(row.tanggal))}" required>
              </div>
              <div>
                <label for="edit-g-class">Kelas Petugas</label>
                <input id="edit-g-class" class="input mt-1" name="kelasPetugas" value="${esc(row.kelasPetugas ?? "")}" required>
              </div>
              <div>
                <label for="edit-g-officer">Nama Petugas</label>
                <input id="edit-g-officer" class="input mt-1" name="petugas" value="${esc(row.petugas ?? "")}" required>
              </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
              <button class="btn btn-soft" type="button" data-close-modal>Batal</button>
              <button class="btn btn-primary" type="submit">${icon("save")} Simpan Perubahan</button>
            </div>
          </form>
        </div>`);
    }


    // =====================================================================
    // PRESENSI PENJAGA TUMBLER (jumlah penjaga 1-6, kelas, nama) - terhubung ke jadwal absensi tipe "tumbler"
    // =====================================================================
    function pjBarisHtml(i) {
      const p = PICKERS["pj" + i];
      return `<div id="pj-petugas-row-${i}" class="${i > 1 ? "hidden" : ""}">
        <label for="${p.search}">Nama Penjaga ${i}</label>
        <div class="mt-1 grid grid-cols-[6.5rem_1fr] gap-2">
          <select id="${p.kelas}" class="input" aria-label="Kelas penjaga ${i}">${classOptions("", "Kelas")}${IS_INTI ? '<option value="Tambahan">Tambahan</option>' : ""}</select>
          <input id="${p.search}" class="input" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Pilih kelas dulu" aria-controls="${p.results}" aria-autocomplete="list" disabled>
        </div>
        <input id="${p.hidden}" type="hidden">
        <p id="${p.selected}" class="mt-2 hidden rounded-xl border border-green-200 bg-green-50 p-2 text-green-950" aria-live="polite"></p>
        <div id="${p.results}" class="mt-2 hidden max-h-60 overflow-y-auto rounded-xl border border-green-100 bg-white" role="listbox" aria-label="Hasil pencarian nama"></div>
      </div>`;
    }

    function terapkanJumlahPj() {
      const jumlah = Number(document.getElementById("pj-officer-count")?.value || 1);
      PJ_PETUGAS_KEYS.forEach((key, i) => {
        const row = document.getElementById("pj-petugas-row-" + (i + 1));
        if (!row) return;
        const tampil = i < jumlah;
        row.classList.toggle("hidden", !tampil);
        if (!tampil) { const sel = pickerEl(key, "kelas"); if (sel) sel.value = ""; resetPicker(key); }
      });
    }
    document.addEventListener("change", (event) => { if (event.target.id === "pj-officer-count") terapkanJumlahPj(); });

    // ---- Penjaga bersama (Input Manual & Scan QR): 1 nama hanya 1x per hari ----
    state.penjagaHariIni = state.penjagaHariIni || [];

    function namaDariPetugas(teks) {
      return String(teks || "").split(/\s*&\s*/).map(n => n.trim()).filter(Boolean);
    }

    function renderPjHariIni() {
      const box = document.getElementById("pjHariIni");
      if (!box) return;
      const daftar = state.penjagaHariIni || [];
      box.innerHTML = daftar.length
        ? `<p class="text-sm font-semibold text-green-900">Sudah presensi hari ini (${daftar.length}):</p>
           <div class="mt-1 flex flex-wrap gap-2">${daftar.map(n => `<span class="badge bg-lime-100 text-green-900">${esc(n)}</span>`).join("")}</div>
           <p class="mt-2 text-xs text-green-800">Isi kolom di bawah hanya bila ada penjaga tambahan.</p>`
        : `<p class="text-sm font-semibold text-amber-800">Belum ada presensi penjaga hari ini. Isi penjaga di bawah sebelum menyimpan pelanggaran atau memulai scan QR.</p>`;
    }

    async function muatPenjagaHariIni() {
      state.penjagaHariIni = [...new Set((state.penjagaLokal && state.penjagaLokal[localDateValue()]) || [])];
      renderPjHariIni();
      try {
        const data = await apiGet("getRekapPenjaga");
        const hariIni = localDateValue();
        const dariServer = (Array.isArray(data) ? data : []).filter(r => r && pdfIso(r.tanggal) === hariIni).flatMap(r => namaDariPetugas(r.petugas));
        state.penjagaHariIni = [...new Set(dariServer.concat((state.penjagaLokal && state.penjagaLokal[hariIni]) || []))];
      } catch (error) { /* offline: pakai catatan lokal */ }
      renderPjHariIni();
    }

    // Menyimpan presensi penjaga bila diisi. Wajib diisi bila hari ini belum ada presensi sama sekali.
    async function simpanPenjagaJikaAda() {
      const jumlah = Number(document.getElementById("pj-officer-count")?.value || 1);
      const baris = PJ_PETUGAS_KEYS.slice(0, jumlah).map((key, i) => ({
        no: i + 1, key,
        kelas: pickerEl(key, "kelas")?.value || "",
        nama: pickerEl(key, "hidden")?.value || "",
        teks: (pickerEl(key, "search")?.value || "").trim()
      }));
      const sudah = state.penjagaHariIni || [];
      const adaIsian = baris.some(b => b.kelas || b.nama || b.teks);
      if (!adaIsian && sudah.length) return;   // presensi hari ini sudah ada, tidak perlu diisi lagi

      const daftar = [];
      baris.forEach(b => {
        daftar.push({ label: "Kelas Penjaga " + b.no, ok: !!b.kelas, id: PICKERS[b.key].kelas });
        daftar.push({ label: "Nama Penjaga " + b.no + " (cari lalu pilih dari daftar)", ok: !!b.nama, id: PICKERS[b.key].search });
      });
      lengkapi(daftar);
      baris.forEach(b => {
        if (!(SISWA_PER_KELAS[b.kelas] || []).includes(b.nama)) throw new Error("Nama Penjaga " + b.no + " harus dipilih dari daftar kelas " + b.kelas + ".");
      });
      const nama = baris.map(b => b.nama);
      if (new Set(nama).size !== nama.length) throw new Error("Nama penjaga tidak boleh sama. Periksa kembali daftar penjaga.");
      const dobel = nama.filter(n => sudah.includes(n));
      if (dobel.length) throw new Error("Sudah presensi hari ini: " + dobel.join(", ") + ". Satu nama hanya bisa tercatat 1x per hari.");

      await apiPost("addPenjaga", {
        tanggal: localDateValue(),
        petugas: nama.join(" & "),
        petugasList: nama,
        penjagaList: baris.map(b => ({ nama: b.nama, kelas: b.kelas })),
        kelasPetugas: [...new Set(baris.map(b => b.kelas))].join(", "),
        jumlahPetugas: jumlah
      });

      const hariIni = localDateValue();
      state.penjagaLokal = state.penjagaLokal || {};
      state.penjagaLokal[hariIni] = (state.penjagaLokal[hariIni] || []).concat(nama);
      state.penjagaHariIni = [...new Set(sudah.concat(nama))];
      const hitung = document.getElementById("pj-officer-count");
      if (hitung) hitung.value = "1";
      PJ_PETUGAS_KEYS.forEach(key => { const sel = pickerEl(key, "kelas"); if (sel) sel.value = ""; resetPicker(key); });
      terapkanJumlahPj();
      renderPjHariIni();
    }

    function renderPenjagaTableAt(targetId, response = state.data.penjaga) {
      const target = document.getElementById(targetId);
      if (!target) return;
      const rows = (Array.isArray(response) ? response : []).slice().reverse();   // terbaru di atas
      if (!rows.length) { target.innerHTML = empty(); return; }
      target.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead><tr><th class="kolom-pilih"><input type="checkbox" data-pilih-semua aria-label="Pilih semua"></th><th>Tanggal</th><th>Kelas Penjaga</th><th>Penjaga</th><th>Aksi</th></tr></thead>
            <tbody>
              ${rows.map(item => {
                const key = cacheRow(item);
                return `
                  <tr>
                    <td class="kolom-pilih"><input type="checkbox" data-pilih-hapus data-row-key="${key}" aria-label="Pilih data"></td>
                    <td>${esc(formatDate(item?.tanggal))}</td>
                    <td><b>${esc(item?.kelasPetugas ?? "")}</b></td>
                    <td>${esc(item?.petugas ?? "")}</td>
                    <td class="whitespace-nowrap"><button class="btn btn-soft px-3 py-2" type="button" data-edit="penjaga" data-row-key="${key}">Edit</button></td>
                  </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>`;
      refreshIcons();
    }

    async function pdfPenjaga() {
      const r = pdfRentang(); pdfValid(r);
      const list = (Array.isArray(state.data.penjaga) ? state.data.penjaga : []).filter(x => x && pdfDalam(x.tanggal, r.dari, r.sampai));
      if (!list.length) throw new Error("Tidak ada data presensi penjaga tumbler pada pilihan ini.");
      await pdfSiapkan();
      const ctx = pdfBaru("Laporan Presensi Penjaga Tumbler", [pdfPeriode(r.dari, r.sampai)], false);
      pdfTeks(ctx, "Jumlah catatan presensi penjaga: " + list.length + " kali.", true);
      const per = {};
      list.forEach(x => { String(x.kelasPetugas || "-").split(/\s*,\s*/).forEach(k => { per[k] = (per[k] || 0) + 1; }); });
      pdfBagian(ctx, "Ringkasan per Kelas Penjaga");
      pdfTabel(ctx, ["No", "Kelas Penjaga", "Jumlah Catatan"],
        Object.entries(per).sort((p, q) => q[1] - p[1]).map(([k, n], i) => [i + 1, k, n + "x"]),
        { columnStyles: { 0: { halign: "center", cellWidth: 12 }, 1: { halign: "center" }, 2: { halign: "center" } } });
      pdfBagian(ctx, "Rincian Penjaga Tumbler");
      pdfTabel(ctx, ["No", "Tanggal", "Kelas Penjaga", "Penjaga"],
        list.slice().reverse().map((x, i) => [i + 1, pdfTgl(x.tanggal), x.kelasPetugas || "", x.petugas || "-"]),
        { columnStyles: { 0: { halign: "center", cellWidth: 11 }, 1: { cellWidth: 38 }, 2: { halign: "center", cellWidth: 28 } } });
      return pdfSelesai(ctx, "Laporan-Penjaga-Tumbler");
    }

    function showEditPenjagaModal(row) {
      setModal(`
        <div class="modal-layer" role="dialog" aria-modal="true" aria-labelledby="edit-title">
          <form id="editPenjagaForm" class="modal-box p-6">
            <div id="modalOperationMessage" class="hidden" role="status" aria-live="polite"></div>
            <div class="flex items-center justify-between gap-4">
              <h2 id="edit-title" class="text-2xl font-extrabold text-green-950">Edit Penjaga Tumbler</h2>
              <button class="btn btn-soft" type="button" data-close-modal>${icon("x")} Tutup</button>
            </div>
            <input type="hidden" name="id" value="${esc(row.id)}">
            <div class="mt-5 space-y-3">
              <div>
                <label for="edit-pj-date">Tanggal</label>
                <input id="edit-pj-date" class="input mt-1" name="tanggal" type="date" value="${esc(inputDateValue(row.tanggal))}" required>
              </div>
              <div>
                <label for="edit-pj-class">Kelas Penjaga</label>
                <input id="edit-pj-class" class="input mt-1" name="kelasPetugas" value="${esc(row.kelasPetugas ?? "")}" required>
              </div>
              <div>
                <label for="edit-pj-officer">Nama Penjaga</label>
                <input id="edit-pj-officer" class="input mt-1" name="petugas" value="${esc(row.petugas ?? "")}" required>
              </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
              <button class="btn btn-soft" type="button" data-close-modal>Batal</button>
              <button class="btn btn-primary" type="submit">${icon("save")} Simpan Perubahan</button>
            </div>
          </form>
        </div>`);
    }

    startHukumanNotifWatcher();

    render();
  </script>
</body>
</html>
